  #banner .card { background: rgba(18,50,74,.85); padding: 20px 28px; border-radius: 16px; max-width: 420px; margin: 16px; }

  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; display: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(20,70,80,.22) 100%); }

  #tiltblur { position: fixed; inset: 0; pointer-events: none; z-index: 1; display: none;
    backdrop-filter: blur(2.5px); -webkit-backdrop-filter: blur(2.5px);
    mask-image: radial-gradient(ellipse 62% 58% at 50% 50%, transparent 55%, #000 100%);
    -webkit-mask-image: radial-gradient(ellipse 62% 58% at 50% 50%, transparent 55%, #000 100%); }
  body.style-A.focus #tiltblur { display: block; }

  背上宝宝 <b id="onBack">5</b> / 5 · 救回 <b id="saves">0</b> · 捞回 <b id="catches">0</b> · 叼走 <b id="eaten">0</b><br>

</div></div>

<script type="module">
import * as THREE from 'three';
import GUI from 'lil-gui';
import * as ART from './art.js';

// ---------- 可调参数 ----------
const DEFAULTS = {
  maxTilt: 30,           // 鼠标推到边缘时的目标倾角（度）
  tiltStiffness: 45,     // 倾斜弹簧：越大越跟手
  tiltDamping: 10,       // 倾斜阻尼：越大越不晃
  weightInfluence: 0.6,  // 宝宝重量把鸭妈妈压歪的程度（shift your weight）
  gravity: 3.2,          // 背上的「手感重力」（不是真实 9.8）
  staticFriction: 0.14,  // 静摩擦：倾角低于此宝宝站得住
  kineticFriction: 0.08, // 动摩擦：滑起来后的减速
  domeCurvature: -0.12,  // 背部形状：正 = 隆起往外滑，负 = 凹陷往中间聚
  wanderStrength: 0.8,   // 宝宝自己乱跑的力度
  quackPull: 2.6,        // 嘎！把宝宝拉回中心的力度
  quackStabilize: 0.6,   // 嘎！扑翅时抵消的晃动比例
  quackCooldown: 2,      // 嘎！冷却（秒）
  steerByTilt: true,     // 倾斜同时会转向
  steerStrength: 5,
  riverSpeed: 3,
  hazardRate: 0.7,       // 危险出现频率倍率
  hitStrength: 2.2,      // 漂流物撞击力度
  slowMoOnFall: true,
  teeterTime: 0.8,       // 扒边窗口（秒）：这段时间内拉回来就算救回
  teeterMargin: 0.2,     // 扒边时最多还能往外滑多少（相对背部大小）
  teeterGrip: 0.5,       // 扒边时抵消外滑力的比例
  teeterSlowMo: true,    // 有宝宝扒边时短暂慢动作
  babySwim: 1.4,         // 落水宝宝游去排队的速度
  climbReach: 1.3,       // 嘎！时离尾巴多近的宝宝能爬上来
  climbPerQuack: 1,      // 每次嘎！最多爬上来几只
  lostTime: 12,          // 在水里多久没被接上就跟丢
  hopImpact: 1.0,        // 宝宝从尾巴爬上背时的冲击（让妈妈抬头，背上的往后滑）
  scrambleTime: 1.1,     // 爬上来后主动往前挪的时间（䴙䴘宝宝会从尾巴一路挪到脖子边）
  scrambleStrength: 1.8, // 往前挪的力度
  lurkerOn: true,        // 水下阴影（鳄龟/狗鱼：只抓水里的宝宝，背上的安全）
  lurkerFirst: 7,        // 开局多久第一次出现（秒）
  lurkerInterval: 13,    // 之后平均间隔（秒）
  lurkerSpeed: 1.8,      // 追水里宝宝的速度
  lurkerWarn: 0.8,       // 咬之前冒泡预警（秒）：这段时间里捞上来或拐开就没事
  lurkerReach: 0.5,      // 咬中半径
  lurkerBump: 1.6,       // 从妈妈身下穿过时顶一下的力度
  artStyle: 'A',         // 美术风格：orig 原版 / A 扁平 / B 绘本 / C 低模
  cameraMode: 'top',     // top = 3D 俯视；chase = 身后追尾
  camHeight: 7,          // 俯视：镜头距离
  camAngle: 22,          // 俯视：偏离垂直的角度（0 = 正上方）
  showLevel: true,       // 俯视：水平仪
  chibi: 0.4,            // 宝宝夸张度：0 = 朴素，1 = 大头大眼长呆毛、动作很多
  focus: false,          // 画面聚焦：环境压暗 + 边缘虚化（F 切换；默认关，保持 Goose 式的明亮）
  cameraFollowRoll: 0.3, // 追尾：镜头跟随倾斜比例（0 = 不跟）
  showLabels: true,
  invertY: false,
};
let P = { ...DEFAULTS };
try {
  const saved = JSON.parse(localStorage.getItem('duckShiftParams_v2') || '{}');
  Object.assign(P, saved);
} catch (e) {}
const saveParams = () => { try { localStorage.setItem('duckShiftParams_v2', JSON.stringify(P)); } catch (e) {} };

// ---------- 基础场景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe9f5);
scene.fog = new THREE.Fog(0xbfe9f5, 18, 45);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
const hemi = new THREE.HemisphereLight(0xffffff, 0x5a8f5a, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 10, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.intensity = 0.45;
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 });
scene.add(sun);

const toon = (color) => new THREE.MeshToonMaterial({ color });
const RIVER_HALF = 4.2;

// 河面：滚动的波纹贴图
function rippleTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#4fb3d9'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, w = 10 + Math.random() * 30;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + w / 2, y - 4, x + w, y); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 12);
  return t;
}
const riverTex = rippleTexture();
const riverTexMat = new THREE.MeshToonMaterial({ color: 0xffffff, map: riverTex });
const river = new THREE.Mesh(new THREE.PlaneGeometry(RIVER_HALF * 2 + 3, 120), riverTexMat);
river.rotation.x = -Math.PI / 2; river.position.z = -30; river.receiveShadow = true; river.userData.skip = true;
scene.add(river);
const waterA = ART.createWater(RIVER_HALF);   // A 风格的水面 shader
const shore = ART.createShore(scene, RIVER_HALF);
const contact = ART.contactShadow(); scene.add(contact);   // 起伏的河岸 + 芦苇/石头/睡莲/树/花（循环滚动）

// ---------- 鸭妈妈 ----------
const BACK_A = 0.5, BACK_B = 0.72;            // 背部可站立区域（半宽 / 半长）
const BODY = { rx: 0.75, ry: 0.5, rz: 1.0, cy: 0.2 };
const backHeight = (x, z) => BODY.cy + BODY.ry * Math.sqrt(Math.max(0, 1 - (x / BODY.rx) ** 2 - (z / BODY.rz) ** 2));

const duck = new THREE.Group();
scene.add(duck);
const M = ART.buildMother(duck, toon, BODY);
const { head, wings, foot, jaw } = M;
// 背部警示区：贴着背的弧面（平的会飘在宝宝上方，把它们染色）
const patchGeo = new THREE.RingGeometry(0.001, 1, 48, 10);
{
  const pp = patchGeo.attributes.position;
  for (let i = 0; i < pp.count; i++) {
    const x = pp.getX(i) * BACK_A, z = -pp.getY(i) * BACK_B;
    pp.setXYZ(i, x, backHeight(x, -z) + 0.008, z);
  }
  patchGeo.computeVertexNormals();
}
const backPatch = new THREE.Mesh(patchGeo, new THREE.MeshToonMaterial({ color: 0xd8b48a, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide }));
backPatch.userData.skip = true;
duck.add(backPatch);
const backGroup = new THREE.Group(); duck.add(backGroup); // 宝宝挂在这里，随鸭妈妈一起倾斜
const PATCH_SAFE = new THREE.Color(0xf4f5f6), PATCH_DANGER = new THREE.Color(0xe8483b);

// 水平仪（俯视时看清倾斜）：实心点 = 实际倾斜，空心圈 = 鼠标目标
const LEVEL_R = 1.45;
const level = new THREE.Group(); scene.add(level);
{
  const ring = new THREE.Mesh(new THREE.RingGeometry(LEVEL_R - 0.015, LEVEL_R + 0.015, 64),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.28 }));   // 细而淡：是参考线，不该抢戏
  ring.rotation.x = -Math.PI / 2; level.add(ring);
  level.userData.actual = new THREE.Mesh(new THREE.CircleGeometry(0.13, 20), new THREE.MeshBasicMaterial({ color: 0xf2a33a }));
  level.userData.target = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.15, 20), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  for (const m of [level.userData.actual, level.userData.target]) { m.rotation.x = -Math.PI / 2; m.material.depthTest = false; m.renderOrder = 5; level.add(m); }
  level.userData.target.position.y = 0.01;
}

// ---------- 宝宝 ----------
function labelSprite(text) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 48;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.85)'; g.beginPath(); g.roundRect(4, 4, 120, 40, 14); g.fill();
  g.fillStyle = '#12324a'; g.font = 'bold 24px system-ui, "PingFang SC", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 64, 25);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(0.42, 0.16, 1); s.renderOrder = 10; return s;
}
const makeDuckling = (color, scale, kind, i) => ART.makeDuckling(toon, color, scale, kind, i);

const KINDS = [
  { kind: 'curious', name: '好奇鬼', color: 0xffe066, mass: 1, scale: 1 },
  { kind: 'sleepy',  name: '瞌睡虫', color: 0xfff1a8, mass: 1, scale: 1 },
  { kind: 'chubby',  name: '小胖墩', color: 0xffc94a, mass: 2, scale: 1.35 },
  { kind: 'twin',    name: '双胞A',  color: 0xffd84d, mass: 1, scale: 0.95 },
  { kind: 'twin',    name: '双胞B',  color: 0xffd84d, mass: 1, scale: 0.95 },
];
const START_POS = [[0, 0.3], [-0.2, -0.15], [0, -0.05], [0.22, -0.2], [-0.05, -0.38]];
let ducklings = [];

function spawnDucklings() {
  for (const d of ducklings) { d.mesh.removeFromParent(); }
  ducklings = KINDS.map((k, i) => {
    const mesh = makeDuckling(k.color, k.scale, k.kind, i);
    const label = labelSprite(k.name); label.position.y = 0.55; mesh.add(label);
    const zz = labelSprite('Zz'); zz.position.set(0.15, 0.45, 0); zz.visible = false; mesh.add(zz);
    const help = labelSprite('救我！'); help.position.y = 0.55; help.visible = false; mesh.add(help);
    backGroup.add(mesh); styleObject(mesh);
    return { ...k, mesh, label, zz, help, teeter: 0, scramble: 0, x: START_POS[i][0], z: START_POS[i][1], vx: 0, vz: 0,
      state: 'onBack', timer: 1 + Math.random() * 3, tx: 0, tz: 0, sleeping: false, sleepTimer: 6 + Math.random() * 4,
      fightTimer: 5 + Math.random() * 4, fighting: false, heading: 0,
      wp: new THREE.Vector3(), wv: new THREE.Vector3(), spin: new THREE.Vector3(), queueIdx: -1, peepCd: 0 };
  });
}

// ---------- 音效（WebAudio 合成，无需素材） ----------
let actx = null, master = null;
function ensureAudio() {
  if (!actx) { actx = new AudioContext(); master = actx.createGain(); master.gain.value = 0.6; master.connect(actx.destination); }
  if (actx.state === 'suspended') actx.resume();
}
function quackSound() {
  if (!actx) return;
  const t = actx.currentTime;
  for (const [delay, f0] of [[0, 480], [0.16, 430]]) {
    const o = actx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t + delay); o.frequency.exponentialRampToValueAtTime(f0 * 0.6, t + delay + 0.14);
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 3;
    const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t + delay);
    g.gain.exponentialRampToValueAtTime(0.6, t + delay + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + delay + 0.15);
    o.connect(f).connect(g).connect(master); o.start(t + delay); o.stop(t + delay + 0.17);
  }
}
function peep(freq, vol = 0.12) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.35, t + 0.07);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.1);
}
function splashSound() {
  if (!actx) return;
  const t = actx.currentTime, len = 0.35, buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(2500, t); f.frequency.exponentialRampToValueAtTime(300, t + len);
  const g = actx.createGain(); g.gain.value = 0.5;
  src.connect(f).connect(g).connect(master); src.start(t);
}
function thudSound() {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.15);
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.2);
}

function bloop(f0 = 220, vol = 0.18) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 1.8, t + 0.08);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.12);
}
function chompSound() {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.16);
}

// ---------- 水花粒子 ----------
const splashPool = [];
const dropGeo = new THREE.SphereGeometry(0.05, 6, 4), dropMat = toon(0xffffff);
for (let i = 0; i < 80; i++) { const m = new THREE.Mesh(dropGeo, dropMat); m.visible = false; scene.add(m); splashPool.push({ m, v: new THREE.Vector3(), life: 0 }); }
function splash(pos, n = 16, power = 1) {
  let spawned = 0;
  for (const p of splashPool) {
    if (p.life > 0) continue;
    p.life = 0.6 + Math.random() * 0.4; p.m.visible = true; p.m.position.copy(pos); p.m.position.y = 0.05;
    const a = Math.random() * Math.PI * 2, r = (0.8 + Math.random() * 1.6) * power;
    p.v.set(Math.cos(a) * r, (2 + Math.random() * 2.5) * power, Math.sin(a) * r);
    if (++spawned >= n) break;
  }
}

const fx = ART.createFX(scene);   // 水圈 / 尾迹 / 嘎！气泡 / 星星

// ---------- 危险：漂流物 / 尾浪 / 老鹰 / 蝴蝶 ----------
const logs = [];
function spawnLog() {
  const g = ART.buildLog(toon);
  g.rotation.y = (Math.random() - 0.5) * 1.2;
  g.position.set((Math.random() * 2 - 1) * (RIVER_HALF - 0.8), 0.08, -40);
  const lf = new THREE.Mesh(new THREE.RingGeometry(0.75, 0.85, 28), foamMat);   // 木头周围的泡沫圈
  lf.rotation.x = -Math.PI / 2; lf.scale.set(1, 0.35, 1); lf.position.y = -0.06; lf.userData.foam = true; lf.visible = curStyle.foam; g.add(lf);
  scene.add(g); logs.push({ g, hit: false }); styleObject(g);
}

function quack() {

  ensureAudio(); quackSound();
  S.quackCd = P.quackCooldown; S.flap = 0.5; S.sink = 0.6;

  fx.ring(S.x, S.z - 0.2, { r0: 0.8, r1: 2.4, life: 0.55, opacity: 0.45, drift: 0 });
  // 身后排队的宝宝：离尾巴够近的从后面爬上来
  const tailX = S.x, tailZ = S.z + BODY.rz;
  let picked = 0;
  const order = train();
  if (L.phase === 'windup' && order.includes(L.target)) order.unshift(...order.splice(order.indexOf(L.target), 1));   // 先救被盯上的
  for (const d of order) {
    if (picked >= P.climbPerQuack) break;
    if (Math.hypot(d.wp.x - tailX, d.wp.z - tailZ) <= P.climbReach) { startHop(d); picked++; }
  }
  S.rollV *= (1 - P.quackStabilize); S.pitchV *= (1 - P.quackStabilize);
  for (const d of ducklings) {
    if (d.state !== 'onBack') continue;
    const r = Math.hypot(d.x / BACK_A, d.z / BACK_B);
    d.vx += -d.x / BACK_A * P.quackPull * (0.4 + r);
    d.vz += -d.z / BACK_B * P.quackPull * (0.4 + r);
    d.sleeping = false; d.sleepTimer = 6 + Math.random() * 4; d.fighting = false;
  }
}

// ---------- 模拟 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const tmpV = new THREE.Vector3();

function updateDucklingOnBack(d, dt) {
  const G = P.gravity;
  // 重力沿背面的分量：右侧低 → 往右滑；鸭头低 → 往前滑；背部隆起 → 往外滑
  let ax = G * Math.sin(S.roll) + G * P.domeCurvature * d.x / BACK_A;
  let az = G * Math.sin(S.pitch) + G * P.domeCurvature * d.z / BACK_B;

  // 性格行为
  let walk = 0.6 * P.wanderStrength, fric = 1;
  d.timer -= dt;
  if (d.scramble > 0) {
    // 刚从尾巴爬上来：拼命往背中间挪；胖墩挪得慢但劲大（力按体重补足）
    d.scramble -= dt;
    d.tx = 0; d.tz = BACK_B * 0.15;
    walk = P.scrambleStrength * (d.mass > 1 ? 1.15 : 1);
    if (d.z > 0) d.scramble = 0;
  } else if (d.kind === 'curious') {
    // 追着蝴蝶跑到背的边缘
    if (d.timer <= 0) { d.timer = rand(1, 2.5); d.tx = bfly.side * BACK_A * 0.8; d.tz = rand(-0.4, 0.4) * BACK_B; }
    walk *= 1.2;
  } else if (d.kind === 'sleepy') {
    d.sleepTimer -= dt;
    if (!d.sleeping && d.sleepTimer <= 0) { d.sleeping = true; d.sleepTimer = rand(4, 7); }
    else if (d.sleeping && d.sleepTimer <= 0) { d.sleeping = false; d.sleepTimer = rand(6, 10); }
    if (d.sleeping) { walk = 0; fric = 0.35; } // 睡着了：不动，但很容易滑
    else if (d.timer <= 0) { d.timer = rand(2, 4); d.tx = rand(-0.4, 0.4) * BACK_A; d.tz = rand(-0.5, 0.5) * BACK_B; }
  } else if (d.kind === 'chubby') {
    walk *= 0.5;
    if (d.timer <= 0) { d.timer = rand(2.5, 5); d.tx = rand(-0.8, 0.8) * BACK_A; d.tz = rand(-0.8, 0.8) * BACK_B; }
  } else if (d.kind === 'twin') {
    const other = ducklings.find(o => o !== d && o.kind === 'twin' && o.state === 'onBack');
    d.fightTimer -= dt;
    if (other && !d.fighting && d.fightTimer <= 0) { d.fighting = other.fighting = true; d.fightTimer = other.fightTimer = rand(6, 10); }
    if (d.fighting && other) { d.tx = other.x; d.tz = other.z; walk *= 1.6; }
    else if (d.timer <= 0) { d.timer = rand(1.5, 3); d.tx = rand(-0.6, 0.6) * BACK_A; d.tz = rand(-0.6, 0.6) * BACK_B; }
  }
  if (walk > 0) {
    const dx = d.tx - d.x, dz = d.tz - d.z, l = Math.hypot(dx, dz);
    if (l > 0.03) { ax += dx / l * walk; az += dz / l * walk; }
  }
  // 老鹰：逃离阴影
  if (hawkState.active && hawkState.t > 1.2) {
    const lx = d.x - (hawkShadow.position.x - S.x), lz = d.z + (hawkShadow.position.z - S.z);
    const l = Math.hypot(lx, lz) || 1;
    if (l < 2.2) { ax += lx / l * 2.2; az += lz / l * 2.2; }
  }

  // 扒边：抓住羽毛边缘，外滑力打折、往外的速度被吃掉
  const nx0 = d.x / (BACK_A * BACK_A), nz0 = d.z / (BACK_B * BACK_B), nl = Math.hypot(nx0, nz0) || 1;
  const nx = nx0 / nl, nz = nz0 / nl;
  if (d.teeter > 0) {
    const an = ax * nx + az * nz;
    if (an > 0) { ax -= nx * an * P.teeterGrip; az -= nz * an * P.teeterGrip; }
    const vn = d.vx * nx + d.vz * nz;
    if (vn > 0) { const k = Math.min(1, 12 * dt); d.vx -= nx * vn * k; d.vz -= nz * vn * k; }
  }
  // 摩擦：静摩擦先粘住，滑起来再用动摩擦
  const speed = Math.hypot(d.vx, d.vz), accel = Math.hypot(ax, az);
  if (d.teeter === 0 && speed < 0.03 && accel < P.staticFriction * G * fric * (d.mass > 1 ? 1.2 : 1)) { d.vx = d.vz = 0; return; }
  d.vx += ax * dt; d.vz += az * dt;
  const sp = Math.hypot(d.vx, d.vz);
  if (sp > 0) {
    const dec = Math.min(sp, P.kineticFriction * G * fric * dt);
    d.vx -= d.vx / sp * dec; d.vz -= d.vz / sp * dec;
  }
  const maxSp = 2.2; const sp2 = Math.hypot(d.vx, d.vz);
  if (sp2 > maxSp) { d.vx *= maxSp / sp2; d.vz *= maxSp / sp2; }
  d.x += d.vx * dt; d.z += d.vz * dt;
}

function collideDucklings() {
  const on = ducklings.filter(d => d.state === 'onBack');
  for (let i = 0; i < on.length; i++) for (let j = i + 1; j < on.length; j++) {
    const a = on[i], b = on[j];
    const minD = 0.13 * (a.scale + b.scale);
    const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
    if (d > 0 && d < minD) {
      const nx = dx / d, nz = dz / d, push = (minD - d), ma = a.mass, mb = b.mass;
      a.x -= nx * push * mb / (ma + mb); a.z -= nz * push * mb / (ma + mb);
      b.x += nx * push * ma / (ma + mb); b.z += nz * push * ma / (ma + mb);
      const rel = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
      let imp = rel < 0 ? -rel * 1.2 : 0;
      if (a.kind === 'twin' && b.kind === 'twin' && a.fighting) { imp += 1.4; a.fighting = b.fighting = false; peep(2600, 0.15); }
      a.vx -= nx * imp * mb / (ma + mb); a.vz -= nz * imp * mb / (ma + mb);
      b.vx += nx * imp * ma / (ma + mb); b.vz += nz * imp * ma / (ma + mb);
    }
  }
}

function fall(d) {
  d.state = 'falling';
  d.mesh.getWorldPosition(d.wp);
  scene.attach(d.mesh);
  const out = new THREE.Vector3(d.x, 0, -d.z).normalize();
  d.wv.set(out.x * 1.5 + d.vx * 0.8 + S.vx, 2.4, out.z * 1.5 - d.vz * 0.8);
  d.spin.set(rand(-12, 12), rand(-8, 8), rand(-12, 12));
  d.zz.visible = false;
  peep(3200, 0.2); d.mouth = 1;
  if (P.slowMoOnFall) S.slowMo = 0.7;
}

const train = () => ducklings.filter(d => d.state === 'floating').sort((a, b) => a.fellAt - b.fellAt);

function startHop(d) {
  d.state = 'hopping'; d.hopT = 0; d.hopFrom = d.wp.clone();
  d.x = THREE.MathUtils.clamp((d.wp.x - S.x) * 0.3, -0.15, 0.15); d.z = -BACK_B * 0.55;   // 从尾巴爬上来，落在背的后部
  S.catches++; peep(2000, 0.18); splash(d.wp, 8, 0.5);
}

function step(dt) {
  // 鸭妈妈倾斜：弹簧追鼠标 + 宝宝重量力矩 + 外力
  const targetRoll = THREE.MathUtils.degToRad(P.maxTilt) * mouse.x;
  const targetPitch = THREE.MathUtils.degToRad(P.maxTilt) * mouse.y * (P.invertY ? -1 : 1);
  let wRoll = 0, wPitch = 0;
  for (const d of ducklings) if (d.state === 'onBack') { wRoll += d.mass * d.x / BACK_A; wPitch += d.mass * d.z / BACK_B; }
  let distRoll = 0;
  if (wake.active) distRoll = Math.sin(wake.t * 7.5) * 3.2 * Math.max(0, 1 - wake.t / 3.5) * wake.side;
  S.rollV += (P.tiltStiffness * (targetRoll - S.roll) - P.tiltDamping * S.rollV + P.weightInfluence * wRoll + distRoll) * dt;
  S.pitchV += (P.tiltStiffness * (targetPitch - S.pitch) - P.tiltDamping * S.pitchV + P.weightInfluence * wPitch * 0.8) * dt;
  S.roll += S.rollV * dt; S.pitch += S.pitchV * dt;
  const lim = THREE.MathUtils.degToRad(50);
  S.roll = THREE.MathUtils.clamp(S.roll, -lim, lim); S.pitch = THREE.MathUtils.clamp(S.pitch, -lim, lim);

  // 倾斜转向 + 河岸反弹
  if (P.steerByTilt) S.vx += Math.sin(S.roll) * P.steerStrength * dt;
  S.vx *= Math.exp(-1.8 * dt); S.x += S.vx * dt;
  if (Math.abs(S.x) > RIVER_HALF - 0.8) {
    S.x = Math.sign(S.x) * (RIVER_HALF - 0.8); S.rollV += -Math.sign(S.x) * P.hitStrength; S.vx *= -0.4; thudSound();
  }

  // 宝宝
  for (const d of ducklings) {
    if (d.state === 'onBack') {
      updateDucklingOnBack(d, dt);
      const r = Math.hypot(d.x / BACK_A, d.z / BACK_B);
      if (r > 1) {
        if (d.teeter === 0) { peep(3000, 0.22); d.mouth = 1; }   // 开始扒边：尖叫
        d.teeter += dt;
        if (r > 1 + P.teeterMargin || d.teeter > P.teeterTime) { d.teeter = 0; fall(d); }
      } else if (d.teeter > 0) {
        d.teeter = 0; S.saves++; peep(1300, 0.18);     // 救回来了
        fx.sparkle(d.mesh.getWorldPosition(new THREE.Vector3()), 5);
      }
    } else if (d.state === 'falling') {
      d.wv.y -= 9.8 * dt; d.wp.addScaledVector(d.wv, dt);
      d.mesh.rotation.x += d.spin.x * dt; d.mesh.rotation.y += d.spin.y * dt; d.mesh.rotation.z += d.spin.z * dt;
      if (d.wp.y <= 0.02) {
        d.wp.y = 0.02; d.state = 'floating'; d.floatT = 0; d.fellAt = performance.now();
        fx.ring(d.wp.x, d.wp.z, { r0: 0.1, r1: 0.9, life: 0.7, opacity: 0.8 }); fx.ring(d.wp.x, d.wp.z, { r0: 0.05, r1: 0.5, life: 0.9, opacity: 0.6 });
        splash(d.wp, 18); splashSound();
      }
    } else if (d.state === 'floating') {
      // 在水里：游到妈妈身后排成一串（秋沙鸭宝宝贴着妈妈的尾流游）
      d.floatT += dt;
      const slot = train().indexOf(d);
      const delay = Math.min(S.xHistory.length - 1, (slot + 1) * 14);
      const tx = S.xHistory.length ? S.xHistory[S.xHistory.length - 1 - delay] : S.x;
      const tz = S.z + BODY.rz + 0.3 + slot * 0.42;
      const dx = tx - d.wp.x, dz = tz - d.wp.z, l = Math.hypot(dx, dz);
      const stepLen = Math.min(l, P.babySwim * dt * (l > 1 ? 1 : 0.6 + l * 0.4));
      if (l > 0.001) { d.wp.x += dx / l * stepLen; d.wp.z += dz / l * stepLen; }
      d.mesh.rotation.x *= 0.9; d.mesh.rotation.z *= 0.9;
      d.mesh.rotation.y += (0 - d.mesh.rotation.y) * Math.min(1, 4 * dt);   // 和妈妈一样朝上游
      if (d.floatT > P.lostTime) { d.state = 'queued'; d.queueIdx = S.queue.length; S.queue.push(d); peep(900, 0.12); }
    } else if (d.state === 'hopping') {
      d.hopT += dt / 0.35; const k = Math.min(1, d.hopT);
      const target = backGroup.localToWorld(tmpV.set(d.x, backHeight(d.x, d.z), -d.z));
      d.wp.lerpVectors(d.hopFrom, target, k); d.wp.y += Math.sin(k * Math.PI) * 0.8;
      d.mesh.rotation.x = -k * Math.PI * 2;
      if (k >= 1) {
        d.state = 'onBack'; backGroup.add(d.mesh); d.mesh.rotation.set(0, 0, 0);
        d.vx = -d.x * 0.6; d.vz = -d.z * 0.6; d.teeter = 0; d.scramble = P.scrambleTime;
        // 落背冲击：从哪边跳上来，妈妈就往哪边一沉
        S.rollV += d.mass * d.x / BACK_A * P.hopImpact; S.pitchV += d.mass * d.z / BACK_B * P.hopImpact * 0.8;
        thudSound(); peep(1500, 0.18); d.mouth = 1; d.land = 1;
        fx.sparkle(d.mesh.getWorldPosition(new THREE.Vector3()), 4);
      }
    } else if (d.state === 'eaten') {
      // 被拖下水
      d.wp.y -= dt * 0.5; d.mesh.rotation.z += dt * 6;
      if (d.wp.y < -0.35) d.mesh.visible = false;
    } else if (d.state === 'queued') {
      // 落水后排到鸭妈妈身后，跟着游（绿头鸭式）
      const delay = Math.min(S.xHistory.length - 1, (d.queueIdx + 1) * 18);
      const tx = S.xHistory.length ? S.xHistory[S.xHistory.length - 1 - delay] : S.x;
      const tz = S.z + BODY.rz + 0.6 + train().length * 0.42 + d.queueIdx * 0.5;
      d.wp.x += (tx - d.wp.x) * Math.min(1, 3 * dt); d.wp.z += (tz - d.wp.z) * Math.min(1, 2 * dt);
      d.mesh.rotation.x *= 0.9; d.mesh.rotation.z *= 0.9;
      d.mesh.rotation.y += (0 - d.mesh.rotation.y) * Math.min(1, 4 * dt);
    }
  }
  collideDucklings();
}

function updateWorld(dt) {
  S.dist += P.riverSpeed * dt;
  for (const t of riverTexes) t.offset.y += P.riverSpeed * dt / (120 / t.repeat.y);
  S.xHistory.push(S.x); if (S.xHistory.length > 400) S.xHistory.shift();
  shore.update(S.dist, performance.now() / 1000, dt, P.riverSpeed);
  fx.update(dt, P.riverSpeed);
  // 尾迹：妈妈两侧交替冒圈，被水流带走就拉成 V 字
  S.wakeEmit = (S.wakeEmit ?? 0) - dt;
  if (S.wakeEmit <= 0 && curStyle.foam) {
    S.wakeEmit = 0.11; S.wakeSide = -(S.wakeSide || 1);
    fx.ring(S.x + S.wakeSide * 0.5, S.z + 0.55, { r0: 0.12, r1: 0.5, life: 1.4, opacity: 0.32, vx: S.wakeSide * 0.35, sz: 0.8 });
    for (const d of ducklings) if ((d.state === 'floating' || d.state === 'queued') && Math.random() < 0.45)
      fx.ring(d.wp.x, d.wp.z + 0.08, { r0: 0.05, r1: 0.24, life: 0.9, opacity: 0.45 });
  }

  // 漂流物
  S.logTimer -= dt * P.hazardRate;
  if (S.logTimer <= 0) { spawnLog(); S.logTimer = rand(2.2, 4.5); }
  for (let i = logs.length - 1; i >= 0; i--) {
    const l = logs[i]; l.g.position.z += P.riverSpeed * dt * 1.15;
    l.g.position.y = 0.08 + Math.sin(performance.now() / 300 + i) * 0.02;
    const dx = S.x - l.g.position.x, dz = l.g.position.z - S.z;
    if (!l.hit && Math.abs(dz) < 0.9 && Math.abs(dx) < 1.1) {
      l.hit = true; thudSound();
      S.rollV += Math.sign(dx || 1) * P.hitStrength; S.pitchV -= P.hitStrength * 0.8; S.vx += Math.sign(dx || 1) * 1.2;
      splash(new THREE.Vector3(l.g.position.x, 0, l.g.position.z), 8, 0.6);
    }
    if (l.hit) l.g.position.x -= Math.sign(dx || 1) * dt * 1.5;
    if (l.g.position.z > 12) { l.g.removeFromParent(); logs.splice(i, 1); }
  }

  // 皮划艇尾浪
  S.wakeTimer -= dt * P.hazardRate;
  if (!wake.active && S.wakeTimer <= 0) { wake.active = true; wake.t = 0; wake.side = Math.random() < 0.5 ? -1 : 1; kayak.visible = true; }
  if (wake.active) {
    wake.t += dt;
    kayak.position.set(S.x + wake.side * 2.6, 0.1, -14 + wake.t * 6);
    paddle.rotation.z = Math.sin(wake.t * 5) * 0.55; paddle.rotation.y = Math.cos(wake.t * 5) * 0.25;
    if (wake.t > 4) { wake.active = false; kayak.visible = false; S.wakeTimer = rand(12, 18); }
  }

  // 老鹰：先投阴影预警，再扫过
  S.hawkTimer -= dt * P.hazardRate;
  if (!hawkState.active && S.hawkTimer <= 0) {
    hawkState.active = true; hawkState.t = 0; const s = Math.random() < 0.5 ? -1 : 1;
    hawkState.x0 = S.x + s * 3; hawkState.x1 = S.x - s * 3;
    hawkShadow.rotation.z = s < 0 ? -Math.PI / 2 : Math.PI / 2;   // 剪影朝飞行方向
    hawk.rotation.y = s < 0 ? -Math.PI / 2 : Math.PI / 2;
  }
  if (hawkState.active) {
    hawkState.t += dt; const t = hawkState.t;
    const k = THREE.MathUtils.clamp((t - 1.2) / 1.8, 0, 1);
    const hx = THREE.MathUtils.lerp(hawkState.x0, hawkState.x1, k);
    hawkShadow.position.set(hx, 0.03, S.z - 0.1);
    const grow = Math.min(1, t / 1.2);
    hawkShadow.scale.setScalar(0.4 + grow * 0.9); hawkShadow.material.opacity = 0.35 * grow * (t > 3 ? Math.max(0, 1 - (t - 3) / 0.5) : 1);
    hawk.visible = t > 1.2 && t < 3.2; hawk.position.set(hx, 3 + Math.sin(t * 4) * 0.1, S.z - 0.1);
    for (const w of hawk.userData.wings) w.rotation.z = w.userData.side * Math.sin(t * 9) * 0.35;
    if (t > 3.5) { hawkState.active = false; hawk.visible = false; hawkShadow.material.opacity = 0; S.hawkTimer = rand(14, 22); }
  }

  updateLurker(dt);

  // 蝴蝶（好奇鬼的目标）
  bfly.timer -= dt; if (bfly.timer <= 0) { bfly.side *= -1; bfly.timer = rand(6, 10); }
  const bt = performance.now() / 1000;
  butterfly.position.lerp(tmpV.set(S.x + bfly.side * 1.1, 1.0 + Math.sin(bt * 2) * 0.15, S.z - 0.1 + Math.sin(bt * 1.3) * 0.3), Math.min(1, dt * 1.5));
  bwings[0].rotation.y = Math.sin(bt * 25) * 1.1; bwings[1].rotation.y = -bwings[0].rotation.y;

  // 水花
  for (const p of splashPool) {
    if (p.life <= 0) continue;
    p.life -= dt; p.v.y -= 9.8 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.scale.setScalar(Math.max(0.01, p.life));
    if (p.life <= 0 || p.m.position.y < -0.1) { p.life = 0; p.m.visible = false; }
  }
}

// 水下阴影：出现 → 追水里最近的宝宝（没有就从妈妈身下穿过顶一下）→ 冒泡预警 → 咬
function updateLurker(dt) {
  for (const p of ripplePool) {
    if (p.life <= 0) continue;
    p.life -= dt; p.m.scale.setScalar(1 + (0.9 - p.life) * 3); p.m.material.opacity = Math.max(0, p.life) * 0.8;
    if (p.life <= 0) p.m.visible = false;
  }
  targetRing.visible = false;
  if (L.phase === 'idle') {
    if (!P.lurkerOn) return;
    S.lurkerTimer -= dt * P.hazardRate;
    if (S.lurkerTimer <= 0) spawnLurker();
    return;
  }
  const moveTo = (tx, tz, speed) => {
    const dx = tx - L.x, dz = tz - L.z, l = Math.hypot(dx, dz);
    if (l < 1e-4) return;
    const st = Math.min(l, speed * dt); L.x += dx / l * st; L.z += dz / l * st;
    L.heading = Math.atan2(-dx, -dz);
  };
  L.fade = Math.min(1, L.fade + dt);
  L.bubble -= dt;
  if (L.phase === 'hunt') {
    let best = null, bd = Infinity;
    for (const d of swimmers()) { const dd = Math.hypot(d.wp.x - L.x, d.wp.z - L.z); if (dd < bd) { bd = dd; best = d; } }
    if (best) {
      moveTo(best.wp.x, best.wp.z, P.lurkerSpeed + (bd > 3 ? P.riverSpeed * 0.8 : 0));
      if (bd < P.lurkerReach * 0.9) { L.phase = 'windup'; L.timer = P.lurkerWarn; L.target = best; bloop(160, 0.25); }
    } else {
      // 没人落水：顺流漂向妈妈，从身下穿过
      moveTo(L.x + (S.x - L.x) * 0.5, L.z + 1, P.riverSpeed * 0.8);
      if (L.z > S.z + 5) { L.phase = 'leave'; L.timer = 1; }
    }
    if (!L.bumped && Math.abs(L.x - S.x) < 0.7 && Math.abs(L.z - S.z) < 0.9) {
      L.bumped = true; thudSound(); bloop(120, 0.3);
      S.rollV += (Math.sign(S.x - L.x) || 1) * P.lurkerBump; S.pitchV += (Math.random() < 0.5 ? -1 : 1) * P.lurkerBump * 0.6;
      splash(new THREE.Vector3(S.x, 0, S.z + 0.4), 10, 0.6);
    }
    if (L.bubble <= 0) { ripple(L.x, L.z); L.bubble = 0.45; }
  } else if (L.phase === 'windup') {
    const d = L.target;
    const inWater = d.state === 'floating' || d.state === 'queued';
    if (inWater) {
      moveTo(d.wp.x, d.wp.z, 0.6);   // 慢慢跟：妈妈拐开、队伍甩起来就能躲掉
      targetRing.visible = true; targetRing.position.set(d.wp.x, 0.035, d.wp.z);
      targetRing.scale.setScalar(1 + 0.25 * Math.sin(performance.now() / 60));
    }
    if (L.bubble <= 0) { ripple(L.x, L.z); bloop(260 + Math.random() * 120, 0.12); L.bubble = 0.09; }
    L.timer -= dt;
    if (!inWater) { L.phase = 'leave'; L.timer = 1; }   // 已经被捞上背：扑空
    else if (L.timer <= 0) {
      if (Math.hypot(d.wp.x - L.x, d.wp.z - L.z) < P.lurkerReach) {
        d.state = 'eaten'; S.eaten++; fx.ring(d.wp.x, d.wp.z, { r0: 0.1, r1: 1.1, life: 0.8, opacity: 0.7, color: 0x0b2a3a }); chompSound(); peep(3400, 0.25); splashSound();
        splash(d.wp, 22, 1.1); if (P.slowMoOnFall) S.slowMo = 0.5;
      } else { chompSound(); splash(new THREE.Vector3(L.x, 0, L.z), 14, 0.8); }
      L.phase = 'leave'; L.timer = 1;
    }
  } else if (L.phase === 'leave') {
    L.z += P.riverSpeed * dt; L.fade -= dt * 2.5;
    if (L.fade <= 0) { L.phase = 'idle'; lurker.visible = false; S.lurkerTimer = P.lurkerInterval * rand(0.7, 1.3); return; }
  }
  const t = performance.now() / 1000;
  lurker.visible = true;
  lurker.position.set(L.x, 0.025, L.z);
  lurker.rotation.z = L.heading;
  for (const c of lurker.children) if (c.userData.flipper) c.rotation.z = c.userData.flipper * (0.6 + Math.sin(t * 5) * 0.35);
  lurkerMat.opacity = Math.max(0, L.fade) * (L.phase === 'windup' ? 0.5 + 0.15 * Math.sin(t * 30) : 0.34);
}
function spawnLurker() {
  Object.assign(L, { phase: 'hunt', x: rand(-1, 1) * (RIVER_HALF - 1), z: S.z - 13, heading: 0, bumped: false, target: null, bubble: 0, fade: 0 });
}

// ---------- 渲染同步 ----------
function syncVisuals(realDt, simDt) {
  const t = performance.now() / 1000;
  const sinkK = S.sink > 0 ? Math.sin(Math.min(1, S.sink / 0.6) * Math.PI) : 0;
  duck.position.set(S.x, Math.sin(t * 2.2) * 0.025 - sinkK * 0.14, S.z);
  foot.visible = sinkK > 0.05; foot.position.z = 1.0 + sinkK * 0.35;
  duck.rotation.set(-S.pitch, 0, -S.roll, 'ZXY');
  // 头：鸟会稳住头部（抵消身体倾斜），没事时左右张望；嘎！时伸脖子张嘴
  const q = S.flap > 0 ? Math.sin(Math.min(1, (0.5 - S.flap) / 0.12) * Math.PI / 2) * Math.min(1, S.flap / 0.15) : 0;
  // 回头看宝宝：有宝宝扒边/落水就扭头盯着它（鸟脖子能转 180°），平时也隔一阵回头瞄一眼——这样玩家才看得到她的脸
  let look = null;
  for (const d of ducklings) {
    if (d.state === 'onBack' && d.teeter > 0) { look = d.mesh.position; break; }
    if (!look && (d.state === 'falling' || d.state === 'floating')) look = duck.worldToLocal(tmpV.copy(d.wp));
  }
  let yaw = Math.sin(t * 0.7) * 0.3 * Math.sin(t * 0.23);
  if (!look && (t % 6.5) > 5.2) look = tmpV.set(Math.sin(t * 0.37) > 0 ? 0.3 : -0.3, 0, 0.6);   // 闲着时回头瞄一眼
  if (look) {
    const hb0 = head.userData.base;
    yaw = THREE.MathUtils.clamp(Math.atan2(-(look.x - hb0.x), -(look.z - hb0.z)), -2.7, 2.7);
  }
  S.headYaw = (S.headYaw ?? 0) + (yaw - (S.headYaw ?? 0)) * Math.min(1, realDt * 7);
  head.rotation.set((S.flap > 0 ? -Math.sin(S.flap * 20) * 0.15 : 0) + S.pitch * 0.5 - q * 0.25, S.headYaw, S.roll * 0.6);
  // 游泳时一点一点地点头；嘎！时伸长脖子、冠羽炸毛；偶尔眨眼
  const hb = head.userData.base, bob = Math.sin(t * 4.4);
  head.position.set(0, hb.y + bob * 0.015 + q * 0.12, hb.z - Math.max(0, bob) * 0.025 - q * 0.16);
  M.crest.scale.set(1 + q * 0.35, 1 + q * 0.6, 1 + q * 0.35);
  const blink = (t % 3.7) < 0.12 || ((t + 1.3) % 7.9) < 0.12;
  for (const e of M.eyes) e.scale.y = blink ? 0.15 : 1;
  M.body.scale.y = BODY.ry * (1 + bob * 0.02);
  jaw.rotation.x = -0.5 * q;
  M.tail.rotation.y = Math.sin(t * 2.6) * 0.12 + S.rollV * 0.03;
  M.crest.rotation.x = Math.sin(t * 3.1) * 0.06 - q * 0.2;
  for (const w of wings) w.rotation.z = w.userData.side * (S.flap > 0 ? Math.abs(Math.sin(S.flap * 25)) * 1.1 : 0.05);

  for (const d of ducklings) {
    d.mouth = (d.mouth || 0) - realDt * 5; d.land = (d.land || 0) - realDt * 4;
    d.label.visible = P.showLabels && d.state === 'onBack';
    if (d.state === 'onBack') {
      d.mesh.position.set(d.x, backHeight(d.x, d.z), -d.z);
      const sp = Math.hypot(d.vx, d.vz);
      if (sp > 0.05) d.heading = Math.atan2(-d.vx, d.vz);
      else if (!d.sleeping) {   // 停下来时慢慢转身东张西望，脸才有机会朝向镜头
        d.idleT = (d.idleT ?? 0) - realDt;
        if (d.idleT <= 0) { d.idleT = (1.5 + Math.random() * 2.5) * (2 - P.chibi); d.idleHeading = d.heading + (Math.random() - 0.5) * (1 + 2.5 * P.chibi); }
        d.heading += ((d.idleHeading ?? d.heading) - d.heading) * Math.min(1, realDt * 3);
      }
      d.mesh.rotation.set(0, d.heading, 0);
      d.mesh.children[0].position.y = sp > 0.05 && !d.sleeping ? Math.abs(Math.sin(t * 18 + d.x * 10)) * 0.03 : 0;
      d.zz.visible = d.sleeping && d.teeter === 0;
      d.help.visible = d.teeter > 0;
      if (d.teeter > 0) { d.label.visible = false; d.mesh.children[0].rotation.z = Math.sin(t * 45) * 0.45; d.mesh.children[0].position.y = Math.abs(Math.sin(t * 30)) * 0.05; }
      else d.mesh.children[0].rotation.z = sp > 0.05 && !d.sleeping ? Math.sin(t * 18 + d.x * 10) * 0.1 : 0;   // 走路一摇一摆
      // 越靠近边缘越慌：啾声更高更急、翅芽乱扑
      const r = Math.hypot(d.x / BACK_A, d.z / BACK_B);
      ART.animateDuckling(d.mesh.children[0], t, { seed: d.seed ??= Math.random(), moving: sp > 0.05 && !d.sleeping, sleeping: d.sleeping, panic: d.teeter > 0 || r > 0.85,
        peep: Math.max(0, d.mouth || 0), land: Math.max(0, d.land || 0), amt: P.chibi });
      d.peepCd -= simDt;
      if (r > 0.72 && d.peepCd <= 0) { peep(1700 + r * 1500, 0.06 + r * 0.06); d.peepCd = 0.6 - r * 0.4 + Math.random() * 0.2; d.mouth = 1; }
      else if (!d.sleeping && Math.random() < simDt * 0.12 * P.chibi) { peep(2300 + Math.random() * 600, 0.025); d.mouth = 1; }   // 闲着偶尔叽一声
    } else {
      d.mesh.position.copy(d.wp);
      d.help.visible = d.state === 'floating';
      if (d.state === 'floating') {
        const prog = Math.min(1, d.floatT / P.lostTime);   // 越久越累，扑腾越急
        d.mesh.position.y = 0.02 + Math.abs(Math.sin(t * (9 + prog * 12) + d.x * 7)) * (0.06 + prog * 0.08);   // 扑腾，越接近爬上来越用力
        d.mesh.children[0].rotation.z = Math.sin(t * 20 + d.z * 5) * 0.35;
      } else if (d.state === 'queued') {
        d.mesh.position.y = 0.02 + Math.sin(t * 4 + d.queueIdx) * 0.02;
        d.mesh.children[0].rotation.z = 0;
      }
      ART.animateDuckling(d.mesh.children[0], t, { seed: d.seed ??= Math.random(), swimming: d.state === 'floating' || d.state === 'queued',
        panic: d.state === 'falling' || d.state === 'floating', peep: Math.max(0, d.mouth || 0), stretch: d.state === 'hopping' ? Math.sin(Math.min(1, d.hopT) * Math.PI) : 0, amt: P.chibi });
    }
  }

  // 背部警示色：宝宝越靠边越红
  let maxR = 0;
  for (const d of ducklings) if (d.state === 'onBack') maxR = Math.max(maxR, Math.hypot(d.x / BACK_A, d.z / BACK_B));
  backPatch.material.color.copy(PATCH_SAFE).lerp(PATCH_DANGER, THREE.MathUtils.clamp((maxR - 0.6) / 0.35, 0, 1));
  backPatch.material.opacity = 0.55 + THREE.MathUtils.clamp((maxR - 0.6) / 0.35, 0, 1) * 0.35;

  if (foam.visible) {
    foam.position.set(S.x, riverC.visible ? 0.05 : 0.02, S.z + 0.05);
    foam.scale.set(0.82 + Math.sin(t * 3) * 0.02, 1.02 + Math.sin(t * 2.3) * 0.03, 1);
  }
  if (riverC.visible) updateRiverC(t);
  waterA.uniforms.uTime.value = t; waterA.uniforms.uDist.value = S.dist;
  waterA.uniforms.uFocus.value.set(S.x, S.z); waterA.uniforms.uFocusAmt.value = P.focus ? 1 : 0;
  contact.position.set(S.x, 0.015, S.z + 0.05); contact.visible = curStyle.key === 'A';

  // 水平仪
  const top = P.cameraMode === 'top';
  level.visible = top && P.showLevel;
  if (level.visible) {
    const maxRad = THREE.MathUtils.degToRad(P.maxTilt);
    level.position.set(S.x, 0.03, S.z);
    level.userData.actual.position.set(THREE.MathUtils.clamp(S.roll / maxRad, -1.3, 1.3) * LEVEL_R, 0, -THREE.MathUtils.clamp(S.pitch / maxRad, -1.3, 1.3) * LEVEL_R);
    level.userData.target.position.set(mouse.x * LEVEL_R, 0.01, -mouse.y * (P.invertY ? -1 : 1) * LEVEL_R);
  }

  // 镜头
  if (top) {
    const a = THREE.MathUtils.degToRad(P.camAngle);
    camera.position.set(S.x * 0.8, P.camHeight * Math.cos(a), S.z * 0.6 + P.camHeight * Math.sin(a));
    camera.lookAt(S.x * 0.8, 0, S.z * 0.6);
  } else {
    camera.position.set(S.x * 0.7, 3.4, S.z + 5.2);
    camera.lookAt(S.x * 0.85, 0.6, S.z - 0.8);
    camera.rotateZ(-S.roll * P.cameraFollowRoll);
  }

  // HUD
  const onBack = ducklings.filter(d => d.state === 'onBack').length;
  document.getElementById('onBack').textContent = onBack;
  document.getElementById('saves').textContent = S.saves;
  document.getElementById('catches').textContent = S.catches;
  document.getElementById('eaten').textContent = S.eaten;
  document.getElementById('dist').textContent = Math.floor(S.dist);
  document.getElementById('best').textContent = Math.floor(best);
  document.getElementById('cdFill').style.width = (100 * (1 - S.quackCd / P.quackCooldown)) + '%';

  if (!S.over && S.started && onBack === 0 && ducklings.every(d => d.state === 'queued' || d.state === 'eaten')) {
    S.over = true;
    if (S.dist > best) { best = S.dist; try { localStorage.setItem('duckShiftBest', String(best)); } catch (e) {} }
    const lost = S.eaten ? `<br>被水下的家伙叼走了 ${S.eaten} 只 😢` : '';
    showBanner(S.eaten === ducklings.length
      ? `<b>宝宝们都被叼走了……</b><br>这次漂了 ${Math.floor(S.dist)} 米<br><br>点击或按 R 重来`
      : `<b>全军落水！</b><br>这次漂了 ${Math.floor(S.dist)} 米<br>宝宝们湿漉漉地跟在后面 🐥🐥🐥${lost}<br><br>点击或按 R 重来`);
  }
}

// ---------- 主循环（固定步长） ----------
const STEP = 1 / 120;
let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, (now - last) / 1000); last = now;
  let simDt = 0;
  if (S.started && !S.paused && !S.over) {
    const teetering = P.teeterSlowMo && ducklings.some(d => d.state === 'onBack' && d.teeter > 0);
    if (S.slowMo > 0) { S.slowMo -= realDt; S.timeScale = 0.3; }
    else S.timeScale += ((teetering ? 0.5 : 1) - S.timeScale) * Math.min(1, realDt * 8);
    simDt = realDt * S.timeScale;
    acc += simDt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    updateWorld(simDt);
    S.quackCd = Math.max(0, S.quackCd - simDt);
    S.flap = Math.max(0, S.flap - simDt);
    S.sink = Math.max(0, S.sink - simDt);
  }
  syncVisuals(realDt, simDt);
  renderer.render(scene, camera);
}
