const POST_NAMES = { none: '原样', cel: '描边卡通', paint: '颜料画', riso: '孔版印刷' };

// ---------- 可调参数 ----------
const DEFAULTS = {
  maxTilt: 30,           // 鼠标推到边缘时的目标倾角（度）
  tiltStiffness: 45,     // 倾斜弹簧：越大越跟手
  tiltDamping: 10,       // 倾斜阻尼：越大越不晃
  weightInfluence: 0.9,  // 宝宝重量把鸭妈妈压歪的程度（shift your weight）
  gravity: 3.2,          // 背上的「手感重力」（不是真实 9.8）
  staticFriction: 0.09,  // 静摩擦：倾角低于此宝宝站得住
  kineticFriction: 0.06, // 动摩擦：滑起来后的减速
  domeCurvature: 0.08,   // 背部形状：正 = 隆起往外滑，负 = 凹陷往中间聚（微隆：不动就会慢慢滑出去）
  wanderStrength: 1.0,   // 宝宝自己乱跑的力度
  swell: 0.9,            // 水面涌动：一直轻轻晃妈妈（越往后越大），逼着玩家持续修正
  quackPull: 2.6,        // 嘎！把宝宝拉回中心的力度
  quackStabilize: 0.6,   // 嘎！扑翅时抵消的晃动比例
  quackCooldown: 2,      // 嘎！冷却（秒）
  steerByTilt: true,     // 倾斜同时会转向
  steerStrength: 5,
  riverSpeed: 3,
  hazardRate: 0.7,       // 危险出现频率倍率
  hitStrength: 2.2,      // 漂流物撞击力度
  slowMoOnFall: true,
  teeterTime: 0.8,       // 扒边窗口（秒）：这段时间内拉回来就算救回
  teeterMargin: 0.2,     // 扒边时最多还能往外滑多少（相对背部大小）
  teeterGrip: 0.5,       // 扒边时抵消外滑力的比例
  teeterSlowMo: true,    // 有宝宝扒边时短暂慢动作
  babySwim: 1.4,         // 落水宝宝游去排队的速度
  climbReach: 1.3,       // 嘎！时离尾巴多近的宝宝能爬上来
  climbPerQuack: 1,      // 每次嘎！立刻爬上来几只（其余的在上船窗口里陆续爬）
  boardTime: 1.2,        // 嘎！后的上船窗口（秒）：游到尾巴边的宝宝一只接一只爬上来
  boardGap: 0.22,        // 上船窗口里每只之间隔多久
  callTime: 1.6,         // 嘎！后水里的宝宝冲刺游向尾巴多久
  callSpeed: 2.2,        // 冲刺时的游速倍数
  lostTime: 12,          // 失温：从暖和到冻透要在水里泡多久（冻透就跟丢）
  warmRate: 0.3,         // 背上回暖速度（每秒回多少体温，背中间更快）
  director: true,        // 节奏编排：热身 → 逐个登场（首次带提示）→ 大威胁不叠加、有喘息 → 慢慢加快。关掉 = 各事件独立计时
  rampTime: 200,         // 多少秒爬到最高强度
  journeyLen: 600,       // 一局的路程（米）：漂到终点的小岛就到家了
  orphanFirst: 30,       // 开局多久出现第一只迷路的宝宝（秒）
  orphanInterval: 32,    // 之后平均间隔（秒）
  adoptReach: 1.4,       // 游到离它多近就会跟上来
  hopImpact: 1.0,        // 宝宝从尾巴爬上背时的冲击（让妈妈抬头，背上的往后滑）
  scrambleTime: 1.1,     // 爬上来后主动往前挪的时间（䴙䴘宝宝会从尾巴一路挪到脖子边）
  scrambleStrength: 1.8, // 往前挪的力度
  lurkerOn: true,        // 水下阴影（鳄龟/狗鱼：只抓水里的宝宝，背上的安全）
  lurkerFirst: 7,        // 开局多久第一次出现（秒）
  lurkerInterval: 13,    // 之后平均间隔（秒）
  lurkerSpeed: 1.8,      // 追水里宝宝的速度
  lurkerWarn: 0.8,       // 咬之前冒泡预警（秒）：这段时间里捞上来或拐开就没事
  lurkerReach: 0.5,      // 咬中半径
  lurkerBump: 1.6,       // 从妈妈身下穿过时顶一下的力度
  hawkCircle: 1.6,       // 鹰盘旋多久才俯冲（秒）
  rapidsFirst: 22,       // 开局多久第一次遇到急流（秒）
  rapidsInterval: 38,    // 之后平均间隔（秒）
  rapidsLen: 26,         // 急流段长度（米）
  rapidsFlow: 1.7,       // 急流里水流加速倍数
  rapidKick: 1.4,        // 浪掀一下的力度
  rapidsRocks: 4,        // 急流里的礁石数
  dropKick: 4.5,         // 落差：往前栽的力度（落水后反弹约 3/4）
  dropSlide: 1.0,        // 落差：背上宝宝往前扑的惯性
  hawkWarn: 1.0,         // 俯冲预警（秒）：这段时间里嘎！就能护住
  rainDry: 0.45,         // 下雨：背上多靠中间（妈妈翅膀底下）还淋不到（相对背部大小）
  rainChill: 0.12,       // 下雨：淋在外圈每秒掉多少体温
  heronReach: 1.5,       // 苍鹭：站在岸边能叼到多远
  heronWarn: 0.9,        // 苍鹭：缩脖子到出击的预警（秒）
  gullWarn: 0.75,        // 海鸥：开始俯冲到抓的时间（秒）
  gullDodge: 0.35,
  minkSpeed: 2.3,        // 水貂：水里追宝宝的速度
  minkWarn: 0.55,        // 水貂：扑之前一顿的预警（秒）
  minkScare: 2.2,        // 水貂：离妈妈多近时嘎！能把它赶走       // 海鸥：抓的那一刻目标偏离瞄准点多远就扑空
  lineDrag: 9,           // 钓线缠脚：把妈妈往缠住那边拽的力度
  lineFree: 1.4,         // 往反方向蹬（鼠标推到另一边）多久能把线踢掉（秒）
  rivalRange: 2.5,       // 别家母鸭：离她多近就会发火
  rivalWarn: 0.9,        // 立起来张翅到冲过来的预警（秒）：这段时间里嘎！她就退回去
  rivalBump: 3.5,        // 撞到妈妈身侧的力度
  displayHold: 0.6,      // 按住 Shift 多久从「嘎！」升级成装受伤（秒）
  displayTime: 2.2,      // 装受伤扑腾多久
  displayShake: 2.4,     // 扑腾时把背上晃得多厉害
  displayCooldown: 18,   // 装受伤的冷却（秒）
  coverTime: 1.0,        // 嘎！后护崽持续多久：背上的缩成团、水里的潜下去
  artStyle: 'A',         // 美术风格：orig 原版 / A 扁平 / B 绘本 / C 低模
  cameraMode: 'top',     // top = 3D 俯视；chase = 身后追尾
  camHeight: 11.5,       // 俯视：镜头距离
  camAngle: 34,          // 俯视：偏离垂直的角度（0 = 正上方）；斜一点才看得到东西的侧面
  camFov: 35,            // 俯视：视角。窄视角 + 拉远 = Goose 那种桌上模型的感觉（近大远小不明显）
  showLevel: false,      // 俯视：水平仪（具身化 UI：默认关，看鸭妈妈身体倾斜就够）
  chibi: 0.4,            // 宝宝夸张度：0 = 朴素，1 = 大头大眼长呆毛、动作很多
  post: 'none',          // 后期风格化：none 原样 / cel 描边卡通 / paint 颜料画 / riso 孔版印刷（V 切换）。Goose 没有描边，默认不描
  debugUI: false,        // 调试用：显示 HUD、文字标签、目标红圈、提示条（正式玩法是具身化 UI，不出现文字）
  focus: false,          // 画面聚焦：环境压暗 + 边缘虚化（F 切换；默认关，保持 Goose 式的明亮）
  cameraFollowRoll: 0.3, // 追尾：镜头跟随倾斜比例（0 = 不跟）
  showLabels: false,
  invertY: false,
  volume: 0.7,           // 总音量
  musicVolume: 0.6,      // 背景音乐音量（0 = 关）
  muted: false,          // M 静音
  uiVersion: 5,
};
let P = { ...DEFAULTS };
try {
  const saved = JSON.parse(localStorage.getItem('duckShiftParams_v2') || '{}');
  if ((saved.uiVersion || 0) < 3) { for (const k of ['showLevel', 'showLabels', 'post', 'focus']) delete saved[k]; }   // 换成具身化 UI：旧存档里的 UI 开关作废
  if ((saved.uiVersion || 0) < 4) { for (const k of ['weightInfluence', 'staticFriction', 'kineticFriction', 'domeCurvature', 'wanderStrength']) delete saved[k]; }   // 背上太稳：这几项平衡参数重置
  if ((saved.uiVersion || 0) < 5) { for (const k of ['camHeight', 'camAngle', 'post']) delete saved[k]; }   // Goose 式镜头：窄视角、斜一点
  saved.uiVersion = 5;
  Object.assign(P, saved);
} catch (e) {}
const saveParams = () => { try { localStorage.setItem('duckShiftParams_v2', JSON.stringify(P)); } catch (e) {} };

// ---------- 基础场景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe9f5);
scene.fog = new THREE.Fog(0xbfe9f5, 18, 45);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
const hemi = new THREE.HemisphereLight(0xffffff, 0x5a8f5a, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 10, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.intensity = 0.45;
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11 });   // 岸上的大树也要投影
scene.add(sun);

const toon = (color) => new THREE.MeshToonMaterial({ color });
const RIVER_HALF = 4.2;

// 河面：滚动的波纹贴图
function rippleTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#4fb3d9'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, w = 10 + Math.random() * 30;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + w / 2, y - 4, x + w, y); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 12);
  return t;
}
const riverTex = rippleTexture();
const riverTexMat = new THREE.MeshToonMaterial({ color: 0xffffff, map: riverTex });
const river = new THREE.Mesh(new THREE.PlaneGeometry(RIVER_HALF * 2 + 3, 120), riverTexMat);
river.rotation.x = -Math.PI / 2; river.position.z = -30; river.receiveShadow = true; river.userData.skip = true;
scene.add(river);
const waterA = ART.createWater(RIVER_HALF);   // A 风格的水面 shader
const shore = ART.createShore(scene, RIVER_HALF);
const contact = ART.contactShadow(); scene.add(contact);   // 起伏的河岸 + 芦苇/石头/睡莲/树/花（循环滚动）

// ---------- 鸭妈妈 ----------
const BACK_A = 0.5, BACK_B = 0.72;            // 背部可站立区域（半宽 / 半长）
const BODY = { rx: 0.75, ry: 0.5, rz: 1.0, cy: 0.2 };
const ellH = (x, z) => BODY.cy + BODY.ry * Math.sqrt(Math.max(0, 1 - (x / BODY.rx) ** 2 - (z / BODY.rz) ** 2));
// 背部高度场：开局从上往下对真实模型（身体/前胸/翅膀）打射线，宝宝站在模型表面上，而不是假想的椭球上（否则会陷进前胸和翅膀）
const HF = { x0: -0.7, z0: -0.95, step: 0.025, nx: 57, nz: 77, h: null };
function backHeight(x, z) {   // z = 背上坐标（往前为正）
  if (!HF.h) return ellH(x, z);
  const gx = THREE.MathUtils.clamp((x - HF.x0) / HF.step, 0, HF.nx - 1.001), gz = THREE.MathUtils.clamp((z - HF.z0) / HF.step, 0, HF.nz - 1.001);
  const i = Math.floor(gx), j = Math.floor(gz), fx = gx - i, fz = gz - j, h = HF.h, n = HF.nx;
  return (h[j * n + i] * (1 - fx) + h[j * n + i + 1] * fx) * (1 - fz) + (h[(j + 1) * n + i] * (1 - fx) + h[(j + 1) * n + i + 1] * fx) * fz;
}

const duck = new THREE.Group();
scene.add(duck);
const M = ART.buildMother(duck, toon, BODY);
const { head, wings, foot, jaw } = M;
{
  duck.updateMatrixWorld(true);
  const targets = [M.body, M.chest, ...M.wings.flatMap(w => w.children)];

const ORPHAN_KINDS = [

const familyN = () => ducklings.filter(d => ['onBack', 'floating', 'queued', 'hopping', 'falling'].includes(d.state)).length;
function updateCreche(dt) {
  S.peak = Math.max(S.peak || 0, familyN());

  if (S.crecheT > 0 || S.arrived) return;
  const strays = ducklings.filter(d => d.state === 'stray').length;
  if (ducklings.length < 40 && strays < 4) {   // 有时一只，有时一小窝走散的一起漂过来
    const n = Math.random() < 0.3 ? 2 + Math.floor(Math.random() * 2) : 1, x0 = rand(-1, 1) * (RIVER_HALF - 1.6);
    for (let i = 0; i < n; i++) { spawnOrphan(); const d = ducklings[ducklings.length - 1]; d.wp.x = x0 + (i - (n - 1) / 2) * 0.35; d.wp.z -= i * 0.3; d.strayVx *= 0.3; }
  }

}
function updateOrphans(dt, flow) {
  if (isCreche()) updateCreche(dt);
  if (!P.director) {
    S.orphanTimer -= dt * P.hazardRate;
    if (S.orphanTimer <= 0) { spawnOrphan(); S.orphanTimer = P.orphanInterval * rand(0.75, 1.25); }
  }
  for (const d of ducklings) {
    if (d.state !== 'stray') continue;
    d.wp.z += flow * dt; d.wp.x += d.strayVx * dt;   // 跟着水漂，自己也乱划
    if (Math.abs(d.wp.x) > RIVER_HALF - 0.8) { d.strayVx = -Math.sign(d.wp.x) * Math.abs(d.strayVx); d.wp.x = Math.sign(d.wp.x) * (RIVER_HALF - 0.8); }   // 只在水里
    d.warmth = Math.max(0.05, d.warmth - dt / freezeT() * 0.5);
    d.strayPeep -= dt;
    if (d.strayPeep <= 0) { d.strayPeep = 0.9; peep(2900, 0.07, d.wp.x); setTimeout(() => peep(3300, 0.06, d.wp.x), 110); d.mouth = 1; }
    if (Math.random() < dt * 3) fx.ring(d.wp.x, d.wp.z, { r0: 0.05, r1: 0.25, life: 0.8, opacity: 0.45 });
    if (Math.hypot(d.wp.x - S.x, d.wp.z - S.z) < P.adoptReach) {   // 接到了：排进身后的队伍

}

// ---------- 音效：真实录音（Freesound 的 CC0 录音，tools/build_sfx.py 切好放在 audio/sfx/） ----------
// 信号链：音效 → 声像（按横向位置左右分） → bus → 慢动作低通 → 干声 + 一点室外混响 → 总音量 → 压限 → 输出
// 环境声（流水、鸟、雨、急流）走 amb，不进混响也不受慢动作影响
// 每个声音有几个变体随机挑，再加一点音高/音量的随机：同一个声音反复听也不腻
let actx = null, bus = null, master = null, slowLP = null, amb = null;
const vary = (v, k = 0.06) => v * (1 + (Math.random() * 2 - 1) * k);
const SFX = { buf: new Map(), clips: {}, last: {}, ready: false };
function ensureAudio() {
  if (!actx) {
    actx = new AudioContext();
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    comp.connect(actx.destination);
    master = actx.createGain(); master.gain.value = P.muted ? 0 : P.volume; master.connect(comp);
    slowLP = actx.createBiquadFilter(); slowLP.type = 'lowpass'; slowLP.frequency.value = 18000; slowLP.Q.value = 0.5;
    bus = actx.createGain(); bus.connect(slowLP); slowLP.connect(master);
    const verb = actx.createConvolver(), wet = actx.createGain(); wet.gain.value = 0.12;
    verb.buffer = makeIR(0.9); slowLP.connect(verb).connect(wet).connect(master);
    amb = actx.createGain(); amb.gain.value = 0; amb.connect(master);
    loadSfx(); loadMusic();
  }
  if (actx.state === 'suspended') actx.resume();
}
function loadSfx() {
  const get = (name) => fetch(`audio/sfx/${name}.mp3`).then(r => r.arrayBuffer()).then(b => actx.decodeAudioData(b)).then(buf => SFX.buf.set(name, buf));
  fetch('audio/sfx/sfx.json').then(r => r.json()).then(m => {
    SFX.clips = m.clips;
    return Promise.all([...Object.values(m.clips).flat(), ...m.loops.map(l => 'loop_' + l)].map(get));
  }).then(() => { SFX.ready = true; }).catch(e => console.warn('音效加载失败', e));
}
function setVolume() { if (master) master.gain.setTargetAtTime(P.muted ? 0 : P.volume, actx.currentTime, 0.05); }
function makeIR(len) {   // 室外的短混响：开阔水面上一点点回声
  const n = Math.floor(actx.sampleRate * len), b = actx.createBuffer(2, n, actx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 3; }
  return b;
}
function out(x) {   // x = 世界坐标里的横向位置：左边的宝宝从左声道叫
  if (x === undefined || !actx.createStereoPanner) return bus;
  const p = actx.createStereoPanner(); p.pan.value = THREE.MathUtils.clamp(x / RIVER_HALF, -1, 1) * 0.7; p.connect(bus);
  return p;
}
function filt(type, f, q, dest) { const b = actx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dest); return b; }
// 放一个录音：随机挑一个变体（不连着重复同一个）；rate 变调，offset/len 只放其中一段
function play(base, { vol = 1, rate = 1, x, delay = 0, offset = 0, len, dest } = {}) {
  if (!actx || !SFX.ready) return null;
  const list = SFX.clips[base]; if (!list) return null;
  let name = list[Math.floor(Math.random() * list.length)];
  if (list.length > 1 && name === SFX.last[base]) name = list[(list.indexOf(name) + 1) % list.length];
  SFX.last[base] = name;
  const t = actx.currentTime + delay, src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = SFX.buf.get(name); src.playbackRate.value = vary(rate, 0.05);
  g.gain.value = vary(vol, 0.1); src.connect(g).connect(dest || out(x));
  src.start(t, offset, len); return src;
}

function quackSound(x) {   // 嘎-嘎：两声真鸭叫，第二声低一点短一点；翅膀跟着扑一下（桥洞底下有回声）
  if (S.underBridge) for (const [d, v] of [[0.16, 0.3], [0.34, 0.17], [0.52, 0.09]]) play('quack', { vol: v, rate: 0.97, x, delay: d, dest: filt('lowpass', 2400, 0.7, out(x)) });
  play('quack', { vol: 0.68, x });
  play('quack', { vol: 0.54, rate: 0.94, x, delay: vary(0.2, 0.1) });
  play('flap', { vol: 0.22, rate: 1.15, x });
}
// 宝宝叽：小鸡的叫声，按 freq 变调（越慌越高），vol 原来是合成器的音量，换算一下
const peepRate = (freq) => THREE.MathUtils.clamp(0.75 + (freq - 900) / 2500 * 0.55, 0.7, 1.35);
function peep(freq, vol = 0.12, x) { play('peep', { vol: Math.min(1, vol * 1.6), rate: peepRate(freq), x }); }   // 尖叫的高频很刺耳：最响也压在嘎！之下
function coldPeep(freq, vol = 0.08, x) {   // 冷得打颤：低一点、发闷、带颤音
  const src = play('peep', { vol: Math.min(1, vol * 3), rate: peepRate(freq) * 0.82, dest: filt('lowpass', 3200, 0.7, out(x)) });
  if (!src) return;
  const lfo = actx.createOscillator(), lg = actx.createGain();
  lfo.frequency.value = vary(20, 0.15); lg.gain.value = 0.05; lfo.connect(lg).connect(src.playbackRate);
  lfo.start(); lfo.stop(actx.currentTime + 0.3);
}
function splashSound(x, size = 1) {   // 落水：水花 + 一声「噗通」
  play(size >= 1.1 ? 'splashbig' : 'splash', { vol: Math.min(1, 0.45 * size), rate: size >= 1.1 ? 1 : vary(1.05, 0.1), x });
  play('plop', { vol: 0.45, rate: vary(0.9, 0.15), x, delay: 0.02 });
}
function thudSound(x) { play('thud', { vol: 0.47, x }); }
// 小提示音：高的用钢琴轻轻点一下（和配乐一个音色）；低的是水下冒泡
function bloop(f0 = 220, vol = 0.18, x) {
  if (f0 >= 300) { if (actx) pianoNote(actx.currentTime + 0.01, Math.round(69 + 12 * Math.log2(f0 / 440)) + 12, Math.min(0.85, vol * 8), 0.35, out(x)); return; }
  play('bubbles', { vol: Math.min(1, vol * 1.1), rate: f0 / 220, x, offset: Math.random() * 0.4, len: 0.16 });   // 水下黑影一路冒泡，很密：要轻
}
function screechSound() { play('hawk', { vol: 0.44 }); }
function whooshSound() { play('whoosh', { vol: 0.34 }); }
function gullSound(x) { play('gull', { vol: 0.52, x }); play('gull', { vol: 0.41, rate: 0.9, x, delay: vary(0.24, 0.1) }); }

  play('gulp', { vol: 0.66, rate: 0.85, x });

// 循环环境声：同一段录音放两份、交叉淡入淡出地接力，接缝听不出来（也不怕 mp3 开头的空白）
const LOOPS = {};
function loopBed(name, dest) {
  if (!LOOPS[name]) { const g = actx.createGain(); g.gain.value = 0; g.connect(dest); LOOPS[name] = { g, next: 0 }; }
  return LOOPS[name];
}
const XF_IN = new Float32Array(32).map((_, i) => Math.sin(i / 31 * Math.PI / 2)), XF_OUT = XF_IN.slice().reverse();   // 等功率交叉淡化
function loopTick(name) {
  const L = LOOPS[name], buf = SFX.buf.get('loop_' + name);
  if (!L || !buf || L.g.gain.value < 0.001 && L.target < 0.001) return;
  const t = actx.currentTime, XF = 1.5, seg = buf.duration - XF - 0.2;
  while (L.next < t + 0.5) {
    const s = Math.max(L.next, t + 0.02), src = actx.createBufferSource(), fg = actx.createGain();
    src.buffer = buf; src.connect(fg).connect(L.g);
    fg.gain.setValueCurveAtTime(XF_IN, s, XF); fg.gain.setValueCurveAtTime(XF_OUT, s + seg, XF);
    src.start(s, 0.1); src.stop(s + seg + XF + 0.05);
    L.next = s + seg;
  }
}
function loopGain(name, v, dest, tc = 0.3) {
  if (!actx || !SFX.ready) return;
  const L = loopBed(name, dest);
  L.target = v; L.g.gain.setTargetAtTime(v, actx.currentTime, tc);
  loopTick(name);
}
function rainGain(v) { loopGain('rain', v * 0.9, amb); }
function rumbleGain(v) { loopGain('rapids', v * 0.8, master, 0.15); }
function ambienceTick(dt, playing) {
  if (!actx) return;
  const t = actx.currentTime;
  amb.gain.setTargetAtTime(playing ? 0.35 : 0.22, t, 0.8);   // 翻笔记本时也留一点水声
  loopGain('stream', 0.55, amb, 0.8);
  loopGain('birds', playing ? 0.3 * (1 - RN.k) : 0.15, amb, 1.5);   // 下雨鸟就不叫了
  loopTick('rain'); loopTick('rapids');
  slowLP.frequency.setTargetAtTime(S.slowMo > 0 ? 1600 : 18000, t, 0.06);   // 扒边救援的慢动作：整个世界闷下去（教学放慢时不闷）
}

// ---------- 背景音乐：德彪西《儿童园地》+ 采样钢琴，Goose 式的分层配乐 ----------
// Goose 的做法：曲子是写好的；同一段音乐有稀疏和饱满两个版本、小节对齐；没事的时候大多是安静的。
// 这里：每天一首曲子（audio/score.json，由 tools/build_score.py 从 CC0 的 MIDI 生成），按乐句播放。
//   平静：只弹旋律 + 低音，轻轻的；一句弹完停一阵（只听得见水声），再接下一句

// ---------- 装受伤（拟伤表演）：按住 Shift，妈妈拖着一只「断」翅在水面扑腾大叫，把所有天敌的注意力引到自己身上 ----------
// 依据：很多雌鸭遇到天敌时会这样「拟伤」，引开天敌让雏鸭躲起来。代价：扑腾得很凶，背上的宝宝站不稳；而且不能常用
function startDisplay() {
  if (TUT.cur === 'hold') learn('hold');
  if (predatorActive()) S.drove++;   // 真的引开了天敌（不是对着空气表演）
  S.display = P.displayTime; S.displayCd = P.displayCooldown; S.shakeT = 0; S.seen.add('display');
  quackSound(S.x); setTimeout(() => quackSound(S.x), 260); setTimeout(() => quackSound(S.x), 560);
  // 天敌都被吸引过来、放弃眼前的目标
  if (['approach', 'circle', 'dive'].includes(hawkState.phase)) { hawkState.phase = 'leave'; hawkState.t = 0; hawkState.target = null; }
  if (HR.phase === 'cock') { HR.phase = 'recover'; HR.t = 0; HR.target = null; HR.cd = 4; }
  if (GL.phase === 'call' || GL.phase === 'swoop') { GL.phase = 'leave'; GL.t = 0; GL.target = null; }
  if (L.phase === 'hunt' || L.phase === 'windup') { L.phase = 'leave'; L.timer = 1; }
  if (RV.phase === 'warn' || RV.phase === 'charge') { RV.phase = 'retreat'; RV.t = 0; }
  minkScare();
}
function updateDisplay(dt) {
  S.display -= dt; S.shakeT = (S.shakeT || 0) - dt;
  if (S.shakeT <= 0) {   // 一下一下地扑腾：左右乱晃、水花四溅
    S.shakeT = 0.16; S.shakeSide = -(S.shakeSide || 1);
    S.rollV += S.shakeSide * P.displayShake * rand(0.7, 1.2); S.pitchV += rand(-0.5, 0.5) * P.displayShake;
    splash(new THREE.Vector3(S.x + S.shakeSide * 0.7, 0, S.z + rand(-0.3, 0.5)), 6, 0.6);
    fx.ring(S.x + S.shakeSide * 0.6, S.z, { r0: 0.2, r1: 1.1, life: 0.6, opacity: 0.5 });
  }
}

function quack() {
  if (!S.started || S.over || S.arrived || S.quackCd > 0) return;
  ensureAudio(); quackSound(S.x); TUT.quacked = true; S.quacks++;
  S.quackCd = P.quackCooldown; S.flap = 0.5; S.sink = 0.6;
  if (RV.phase === 'warn' || RV.phase === 'charge') { RV.phase = 'retreat'; RV.t = 0; bloop(330, 0.12); }   // 妈妈凶回去：别家母鸭退了
  if (Math.hypot(MK.x - S.x, MK.z - S.z) < P.minkScare) minkScare();   // 水貂冲到跟前：妈妈扑过去
  // 护崽：背上的缩成团、水里的潜下去（真实的母鸭报警时雏鸭就是这么躲的）
  S.cover = P.coverTime;
  for (const d of ducklings) if (d.state === 'floating' || d.state === 'queued') fx.ring(d.wp.x, d.wp.z, { r0: 0.05, r1: 0.35, life: 0.5, opacity: 0.6 });
  fx.quackPop(head.localToWorld(new THREE.Vector3(0.35, 0.55, -0.2)));
  fx.ring(S.x, S.z - 0.2, { r0: 0.8, r1: 2.4, life: 0.55, opacity: 0.45, drift: 0 });
  // 身后排队的宝宝：离尾巴够近的从后面爬上来
  const tailX = S.x, tailZ = S.z + BODY.rz;
  let picked = 0;
  const order = train();
  if (L.phase === 'windup' && order.includes(L.target)) order.unshift(...order.splice(order.indexOf(L.target), 1));   // 先救被盯上的
  for (const d of order) {
    if (picked >= P.climbPerQuack) break;
    if (Math.hypot(d.wp.x - tailX, d.wp.z - tailZ) <= P.climbReach) { startHop(d); picked++; }
  }
  S.board = P.boardTime; S.boardNext = P.boardGap; S.call = P.callTime;   // 「快过来！」：水里的都冲向尾巴，窗口里一只接一只爬上来
  S.rollV *= (1 - P.quackStabilize); S.pitchV *= (1 - P.quackStabilize);

    if (d.state !== 'onBack') continue;
    const r = Math.hypot(d.x / BACK_A, d.z / BACK_B);
    d.vx += -d.x / BACK_A * P.quackPull * (0.4 + r);

    d.sleeping = false; d.sleepTimer = 6 + Math.random() * 4; d.fighting = false;
  }
}

// ---------- 模拟 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const tmpV = new THREE.Vector3();

function updateDucklingOnBack(d, dt) {
  const G = P.gravity;
  // 重力沿背面的分量：右侧低 → 往右滑；鸭头低 → 往前滑；背部隆起 → 往外滑
  let ax = G * Math.sin(S.roll) + G * P.domeCurvature * d.x / BACK_A;
  let az = G * Math.sin(S.pitch) + G * P.domeCurvature * d.z / BACK_B;

  // 性格行为
  let walk = 0.6 * P.wanderStrength * (0.5 + 0.5 * d.warmth), fric = 1;   // 冷的宝宝动作迟缓
  d.timer -= dt;
  if (d.scramble > 0) {
    // 刚从尾巴爬上来：拼命往背中间挪；胖墩挪得慢但劲大（力按体重补足）
    d.scramble -= dt;
    d.tx = 0; d.tz = BACK_B * 0.15;
    walk = P.scrambleStrength * (d.mass > 1 ? 1.15 : 1);
    if (d.z > 0) d.scramble = 0;
  } else if (d.kind === 'curious') {
    // 追着蝴蝶跑到背的边缘
    if (d.timer <= 0) { d.timer = rand(1, 2.5); d.tx = bfly.side * BACK_A * 0.8; d.tz = rand(-0.4, 0.4) * BACK_B; }
    walk *= 1.2;
  } else if (d.kind === 'sleepy') {
    d.sleepTimer -= dt;
    if (!d.sleeping && d.sleepTimer <= 0) { d.sleeping = true; d.sleepTimer = rand(4, 7); d.log.naps++; }
    else if (d.sleeping && d.sleepTimer <= 0) { d.sleeping = false; d.sleepTimer = rand(6, 10); }
    if (d.sleeping) { walk = 0; fric = 0.35; } // 睡着了：不动，但很容易滑
    else if (d.timer <= 0) { d.timer = rand(2, 4); d.tx = rand(-0.4, 0.4) * BACK_A; d.tz = rand(-0.5, 0.5) * BACK_B; }
  } else if (d.kind === 'chubby') {
    walk *= 0.5;
    if (d.timer <= 0) { d.timer = rand(2.5, 5); d.tx = rand(-0.8, 0.8) * BACK_A; d.tz = rand(-0.8, 0.8) * BACK_B; }
  } else if (d.kind === 'twin') {
    const other = ducklings.find(o => o !== d && o.kind === 'twin' && o.state === 'onBack');
    d.fightTimer -= dt;
    if (other && !d.fighting && d.fightTimer <= 0) { d.fighting = other.fighting = true; d.fightTimer = other.fightTimer = rand(6, 10); }
    if (d.fighting && other) { d.tx = other.x; d.tz = other.z; walk *= 1.6; }
    else if (d.timer <= 0) { d.timer = rand(1.5, 3); d.tx = rand(-0.6, 0.6) * BACK_A; d.tz = rand(-0.6, 0.6) * BACK_B; }
  }
  // 蜉蝣羽化：妈妈游进虫群，背上的宝宝兴奋地冲到靠虫子那边的边上去啄（背上坐标：x 向右，z 向前 = 世界 -z）
  const bugs = hatchNear();
  if (bugs && d.scramble <= 0 && !d.sleeping) {
    const bx = HT.x - S.x, bz = -(HT.z - S.z), bl = Math.hypot(bx, bz) || 1;
    d.tx = bx / bl * BACK_A * 0.95; d.tz = bz / bl * BACK_B * 0.95; walk = Math.max(walk, 0.9 * P.wanderStrength + 0.5);
    const r = Math.hypot(d.x / BACK_A, d.z / BACK_B);
    if (r > 0.7 && Math.random() < dt * 1.2) eatBug(d, d.mesh.getWorldPosition(new THREE.Vector3()));
  }
  if (d.warmth < 0.25) fric *= 0.45 + 2.2 * d.warmth;   // 冻僵了：抓不住羽毛，很容易滑
  if (walk > 0) {
    const hk = d.scramble > 0 ? 0 : 0.8 * RN.k;   // 下雨：都想往妈妈翅膀底下（背中间）挤
    const dx = d.tx * (1 - hk) - d.x, dz = d.tz * (1 - hk) - d.z, l = Math.hypot(dx, dz);
    if (l > 0.03) { ax += dx / l * walk; az += dz / l * walk; }
  }
  // 老鹰：盘旋/俯冲时宝宝本能地躲影子（会把自己挤到边上）；嘎！护住时缩成团不乱跑
  if ((hawkState.phase === 'circle' || hawkState.phase === 'dive') && !(S.cover > 0)) {
    const lx = d.x - (hawkShadow.position.x - S.x), lz = d.z + (hawkShadow.position.z - S.z);
    const l = Math.hypot(lx, lz) || 1;
    if (l < 2.2) { ax += lx / l * 2.2; az += lz / l * 2.2; }
  }

  // 扒边：抓住羽毛边缘，外滑力打折、往外的速度被吃掉
  const nx0 = d.x / (BACK_A * BACK_A), nz0 = d.z / (BACK_B * BACK_B), nl = Math.hypot(nx0, nz0) || 1;
  const nx = nx0 / nl, nz = nz0 / nl;
  if (d.teeter > 0) {
    const an = ax * nx + az * nz;
    if (an > 0) { ax -= nx * an * P.teeterGrip; az -= nz * an * P.teeterGrip; }
    const vn = d.vx * nx + d.vz * nz;
    if (vn > 0) { const k = Math.min(1, 12 * dt); d.vx -= nx * vn * k; d.vz -= nz * vn * k; }
  }
  // 摩擦：静摩擦先粘住，滑起来再用动摩擦
  const speed = Math.hypot(d.vx, d.vz), accel = Math.hypot(ax, az);
  if (d.teeter === 0 && speed < 0.03 && accel < P.staticFriction * G * fric * (d.mass > 1 ? 1.2 : 1)) { d.vx = d.vz = 0; return; }
  d.vx += ax * dt; d.vz += az * dt;
  const sp = Math.hypot(d.vx, d.vz);
  if (sp > 0) {
    const dec = Math.min(sp, P.kineticFriction * G * fric * dt);
    d.vx -= d.vx / sp * dec; d.vz -= d.vz / sp * dec;
  }
  const maxSp = 2.2; const sp2 = Math.hypot(d.vx, d.vz);
  if (sp2 > maxSp) { d.vx *= maxSp / sp2; d.vz *= maxSp / sp2; }
  d.x += d.vx * dt; d.z += d.vz * dt;
}

function collideDucklings() {
  const on = ducklings.filter(d => d.state === 'onBack');
  for (const d of on) {   // 脖子是障碍物
    const dx = d.x, dz = d.z - NECK.z, dd = Math.hypot(dx, dz), minD = NECK.r + 0.12 * d.scale;
    if (dd < minD) {
      const nx = dd > 1e-4 ? dx / dd : (Math.random() < 0.5 ? -1 : 1), nz = dd > 1e-4 ? dz / dd : 0;
      d.x = nx * minD; d.z = NECK.z + nz * minD;
      const vn = d.vx * nx + d.vz * nz; if (vn < 0) { d.vx -= vn * nx; d.vz -= vn * nz; }
    }
  }
  // 宝宝之间：每只两个碰撞圆（身体 + 跟着朝向伸出去的大头），两两检测，头不会再插进别人身体里
  const hr = 0.12 * (1 + 0.2 * P.chibi);
  const circles = d => {
    const fx = -Math.sin(d.heading), fz = Math.cos(d.heading);   // 朝向（背上坐标）
    return [[d.x, d.z, 0.135 * d.scale], [d.x + fx * 0.1 * d.scale, d.z + fz * 0.1 * d.scale, hr * d.scale]];
  };
  for (let i = 0; i < on.length; i++) for (let j = i + 1; j < on.length; j++) {
    const a = on[i], b = on[j];
    let best = 0, nx = 0, nz = 0;
    for (const ca of circles(a)) for (const cb of circles(b)) {
      const dx = cb[0] - ca[0], dz = cb[1] - ca[1], dd = Math.hypot(dx, dz), pen = ca[2] + cb[2] - dd;
      if (pen > best) { best = pen; nx = dd > 1e-4 ? dx / dd : 1; nz = dd > 1e-4 ? dz / dd : 0; }
    }
    if (best > 0) {
      const ma = a.mass, mb = b.mass;
      a.x -= nx * best * mb / (ma + mb); a.z -= nz * best * mb / (ma + mb);
      b.x += nx * best * ma / (ma + mb); b.z += nz * best * ma / (ma + mb);
      const rel = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
      let imp = rel < 0 ? -rel * 1.2 : 0;
      if (a.kind === 'twin' && b.kind === 'twin' && a.fighting) {   // 双胞胎顶头：「咚」地弹开、冒星星，妈妈偶尔面无表情地看一眼
        imp += 1.4; a.fighting = b.fighting = false; peep(2600, 0.15); bloop(700, 0.05); a.log.fights++;
        fx.sparkle(a.mesh.getWorldPosition(new THREE.Vector3()).lerp(b.mesh.getWorldPosition(new THREE.Vector3()), 0.5).setY(a.mesh.getWorldPosition(tmpV).y + 0.25), 3);
        if (Math.random() < 0.35) deadpan(1.1);
      }
      a.vx -= nx * imp * mb / (ma + mb); a.vz -= nz * imp * mb / (ma + mb);
      b.vx += nx * imp * ma / (ma + mb); b.vz += nz * imp * ma / (ma + mb);
    }
  }
}

function fall(d) {
  d.log.falls++;
  if (d.sleeping) { d.log.napFalls++; d.dozeSwim = rand(1.3, 1.8); }   // 睡着滑下去的：在水里还睡一会儿才惊醒
  d.sleeping = false; d.sneeze = 0;
  d.state = 'falling';
  d.mesh.getWorldPosition(d.wp);
  scene.attach(d.mesh);
  const out = new THREE.Vector3(d.x, 0, -d.z).normalize();
  d.wv.set(out.x * 1.5 + d.vx * 0.8 + S.vx, 2.4, out.z * 1.5 - d.vz * 0.8);
  d.spin.set(rand(-12, 12), rand(-8, 8), rand(-12, 12));
  d.zz.visible = false;
  peep(3200, 0.2, d.wp.x); d.mouth = 1;
  if (P.slowMoOnFall) S.slowMo = 0.7;
}

// 妈妈的冷面：回头、半垂眼皮盯着镜头一会儿（不挡事：有宝宝扒边或者天敌盯上就立刻收回）
function deadpan(t = 1) { if ((S.stareCd || 0) > 0 || S.display > 0) return; S.stare = t; S.stareSide = Math.random() < 0.5 ? -1 : 1; S.stareCd = 7; }
function sneezeBurst(d) {
  d.log.sneezes++; d.mouth = 1;
  play('peep', { vol: 0.22, rate: 1.45, x: S.x + d.x, len: 0.09 }); play('plop', { vol: 0.12, rate: 2.2, x: S.x + d.x, delay: 0.03 });
  const fx0 = -Math.sin(d.heading), fz0 = Math.cos(d.heading);   // 往脸朝的反方向坐一下
  d.vx -= fx0 * 0.5; d.vz -= fz0 * 0.5;
  for (const o of ducklings) {
    if (o === d || o.state !== 'onBack') continue;
    const dx = o.x - d.x, dz = o.z - d.z, dd = Math.hypot(dx, dz);
    if (dd < 0.32 && dd > 1e-4) { o.vx += dx / dd * 0.45; o.vz += dz / dd * 0.45; o.mouth = 1; if (o.sleeping) { o.sleeping = false; o.sleepTimer = rand(6, 10); } }
  }
  const wp = d.mesh.getWorldPosition(new THREE.Vector3());
  fx.ring(wp.x - fx0 * 0.15, wp.z + fz0 * 0.15, { r0: 0.02, r1: 0.18, life: 0.35, opacity: 0.7, y: wp.y + 0.2, drift: 0 });
}
function jumpOff(d) { fall(d); d.log.falls--; d.wv.multiplyScalar(0.55); S.slowMo = 0; d.mouth = 1; }   // 自己跳下去：不慢动作
const train = () => ducklings.filter(d => d.state === 'floating').sort((a, b) => a.fellAt - b.fellAt);

function startHop(d) {
  d.state = 'hopping'; d.hopT = 0; d.hopFrom = d.wp.clone();
  d.x = THREE.MathUtils.clamp((d.wp.x - S.x) * 0.3, -0.15, 0.15); d.z = -BACK_B * 0.55;   // 从尾巴爬上来，落在背的后部
  S.catches++; d.log.scoops++; d.dozeSwim = 0; peep(2000, 0.18, d.wp.x); splash(d.wp, 8, 0.5);
}

function step(dt) {
  S.stare = Math.max(0, (S.stare || 0) - dt); S.stareCd = Math.max(0, (S.stareCd || 0) - dt); S.oof = Math.max(0, (S.oof || 0) - dt);
  S.board = Math.max(0, (S.board || 0) - dt); S.boardNext = (S.boardNext || 0) - dt; S.call = Math.max(0, (S.call || 0) - dt);
  // 鸭妈妈倾斜：弹簧追鼠标 + 宝宝重量力矩 + 外力
  const targetRoll = S.arrived ? 0 : THREE.MathUtils.degToRad(P.maxTilt) * mouse.x;   // 到家后不再听鼠标
  const targetPitch = S.arrived ? 0 : THREE.MathUtils.degToRad(P.maxTilt) * mouse.y * (P.invertY ? -1 : 1);
  let wRoll = 0, wPitch = 0;
  for (const d of ducklings) if (d.state === 'onBack') { wRoll += d.mass * d.x / BACK_A; wPitch += d.mass * d.z / BACK_B; }
  let distRoll = 0;
  if (wake.active) distRoll = Math.sin(wake.t * 7.5) * 3.2 * Math.max(0, 1 - wake.t / 3.5) * wake.side;
  // 水面涌动：两个不同频率的起伏叠加，越往后越大；到家后平静
  const swT = S.time || 0, swK = S.arrived ? 0 : P.swell * (0.6 + 0.6 * Math.min(1, isCreche() ? S.time / 300 : S.dist / dayLen()));
  distRoll += swK * (Math.sin(swT * 1.3) + 0.6 * Math.sin(swT * 2.9 + 1.7));
  const distPitch = swK * 0.7 * (Math.sin(swT * 1.1 + 0.5) + 0.5 * Math.sin(swT * 3.3));
  if (FL.phase === 'snag') { distRoll += FL.side * P.lineDrag; S.vx += FL.side * 0.6 * dt; }   // 钓线缠住一只脚：拖着那边往下沉、往那边偏
  S.rollV += (P.tiltStiffness * (targetRoll - S.roll) - P.tiltDamping * S.rollV + P.weightInfluence * wRoll + distRoll) * dt;
  S.pitchV += (P.tiltStiffness * (targetPitch - S.pitch) - P.tiltDamping * S.pitchV + P.weightInfluence * wPitch * 0.8 + distPitch) * dt;
  S.roll += S.rollV * dt; S.pitch += S.pitchV * dt;
  const lim = THREE.MathUtils.degToRad(50);
  S.roll = THREE.MathUtils.clamp(S.roll, -lim, lim); S.pitch = THREE.MathUtils.clamp(S.pitch, -lim, lim);

  // 倾斜转向 + 河岸反弹
  if (P.steerByTilt) S.vx += Math.sin(S.roll) * P.steerStrength * dt;
  S.vx *= Math.exp(-1.8 * dt); S.x += S.vx * dt;

    S.x = Math.sign(S.x) * (RIVER_HALF - 0.8); S.rollV += -Math.sign(S.x) * P.hitStrength; S.vx *= -0.4; thudSound();
  }

  // 宝宝
  for (const d of ducklings) {
    if (d.state === 'onBack' && S.arrived) continue;   // 到家了：在背上等着轮到自己跳
    if (d.state === 'onBack') {
      updateDucklingOnBack(d, dt);
      const r = Math.hypot(d.x / BACK_A, d.z / BACK_B);
      // 背上回暖，越靠中间（羽毛底下）越快；下雨时外圈淋湿反而掉体温（雏鸭的绒毛还不防水，只有妈妈翅膀底下是干的）
      const wetK = RN.k * THREE.MathUtils.smoothstep(r, P.rainDry - 0.1, P.rainDry + 0.15);
      d.warmth = THREE.MathUtils.clamp(d.warmth + dt * (P.warmRate * (1.3 - 0.7 * Math.min(1, r)) * (1 - wetK) - P.rainChill * wetK / (1 + 1.2 * growth())), 0, 1);
      // 打喷嚏：刚泡过水、还没暖透（或者在淋雨）的宝宝偶尔「啾！」一下，往后一坐，把旁边的挤开一点
      d.sneezeCd -= dt;
      if (d.sneeze > 0) {
        const was = d.sneeze; d.sneeze -= dt;
        if (was > 0.12 && d.sneeze <= 0.12) sneezeBurst(d);
      } else if (d.sneezeCd <= 0 && !d.sleeping && d.teeter === 0 && (d.warmth < 0.8 || RN.k > 0.3) && r < 0.6 && !S.arrived) {
        d.sneeze = 0.45; d.sneezeCd = rand(7, 14);
      }
      // 长大了的宝宝：暖和、平静时会自己跳下水游一会儿（妈妈渐渐从「驮着」变成「领着」）
      if (growth() >= 0.5 && d.teeter === 0 && d.warmth > 0.85 && !S.arrived && !bigActive() && Math.random() < dt * 0.03 * growth()) { jumpOff(d); continue; }
      if (r > 1) {
        if (d.teeter === 0) { peep(3000, 0.22, S.x + d.x); d.mouth = 1; S.stare = 0; }   // 开始扒边：尖叫（妈妈别再发呆了）
        d.teeter += dt;
        if (r > 1 + P.teeterMargin || d.teeter > P.teeterTime) { d.teeter = 0; fall(d); }
      } else if (d.teeter > 0) {
        d.teeter = 0; S.saves++; d.log.saves++; peep(1300, 0.18, S.x + d.x);     // 救回来了
        if (Math.random() < 0.4) deadpan(0.9);   // 有时候救回来后，妈妈回头面无表情地看一眼（Goose 式的冷幽默）
        fx.sparkle(d.mesh.getWorldPosition(new THREE.Vector3()), 5);
      }
    } else if (d.state === 'falling') {
      d.wv.y -= 9.8 * dt; d.wp.addScaledVector(d.wv, dt);
      d.mesh.rotation.x += d.spin.x * dt; d.mesh.rotation.y += d.spin.y * dt; d.mesh.rotation.z += d.spin.z * dt;
      if (d.wp.y <= 0.02) {
        d.wp.y = 0.02; d.state = 'floating'; d.floatT = 0; d.fellAt = performance.now();
        fx.ring(d.wp.x, d.wp.z, { r0: 0.1, r1: 0.9, life: 0.7, opacity: 0.8 }); fx.ring(d.wp.x, d.wp.z, { r0: 0.05, r1: 0.5, life: 0.9, opacity: 0.6 });
        splash(d.wp, 18); splashSound(d.wp.x, 0.8);
      }
    } else if (d.state === 'floating') {
      // 在水里：游到妈妈身后排成一串（秋沙鸭宝宝贴着妈妈的尾流游）
      d.floatT += dt;
      d.warmth = Math.max(0, d.warmth - dt * (1 + 0.6 * RN.k) / freezeT());
      if (d.dozeSwim > 0) {   // 睡着掉下来的：浮在水上继续睡，顺水往后漂；醒来一激灵蹦起来
        d.dozeSwim -= dt; d.wp.z += P.riverSpeed * 0.15 * dt;
        if (d.dozeSwim <= 0) { d.startle = 0.45; peep(3400, 0.2, d.wp.x); d.mouth = 1; splash(d.wp, 6, 0.4); fx.ring(d.wp.x, d.wp.z, { r0: 0.05, r1: 0.4, life: 0.6, opacity: 0.6 }); }
        continue;
      }   // 水里失温（下雨更快）（会累积：没暖透又掉下来冷得更快；越大越耐冷）
      const slot = train().indexOf(d);
      const delay = Math.min(S.xHistory.length - 1, (slot + 1) * 14);
      const tx = S.xHistory.length ? S.xHistory[S.xHistory.length - 1 - delay] : S.x;
      const calling = S.call > 0;   // 妈妈刚嘎过：队伍收紧、拼命往尾巴游
      if (MS.k > 0.4 && !calling) {   // 雾里看不见妈妈：慢慢漂散、往后落（嘎！一声就能循着叫声找回来）
        d.mistDrift = (d.mistDrift ?? (Math.random() < 0.5 ? -1 : 1));
        d.wp.x += d.mistDrift * 0.35 * MS.k * dt; d.wp.z += P.riverSpeed * 0.12 * MS.k * dt;
        if (Math.abs(d.wp.x) > RIVER_HALF - 0.8) d.mistDrift *= -1;
        continue;
      }
      d.mistDrift = undefined;
      const tz = S.z + BODY.rz + 0.3 + slot * (calling ? 0.22 : 0.42) + (1 - d.warmth) * (calling ? 0.3 : 0.9);   // 越冷越跟不上，往后落
      const dx = (calling ? S.x : tx) - d.wp.x, dz = tz - d.wp.z, l = Math.hypot(dx, dz);
      const stepLen = Math.min(l, P.babySwim * swimMul() * (calling ? P.callSpeed : 1) * (0.4 + 0.6 * d.warmth) * dt * (l > 1 ? 1 : 0.6 + l * 0.4));   // 越冷游得越慢
      // 上船窗口：游到尾巴边就爬上来（一只接一只）
      if (S.board > 0 && S.boardNext <= 0 && Math.hypot(d.wp.x - S.x, d.wp.z - (S.z + BODY.rz)) <= P.climbReach) { startHop(d); S.boardNext = P.boardGap; continue; }
      if (l > 0.001) { d.wp.x += dx / l * stepLen; d.wp.z += dz / l * stepLen; }
      d.mesh.rotation.x *= 0.9; d.mesh.rotation.z *= 0.9;
      d.mesh.rotation.y += (0 - d.mesh.rotation.y) * Math.min(1, 4 * dt);   // 和妈妈一样朝上游
      if (d.warmth <= 0) { d.state = 'queued'; d.queueIdx = S.queue.length; S.queue.push(d); peep(900, 0.12, d.wp.x); }
    } else if (d.state === 'hopping') {
      d.hopT += dt / 0.35; const k = Math.min(1, d.hopT);
      const target = backGroup.localToWorld(tmpV.set(d.x, backHeight(d.x, d.z), -d.z));
      d.wp.lerpVectors(d.hopFrom, target, k); d.wp.y += Math.sin(k * Math.PI) * 0.8;
      d.mesh.rotation.x = -k * Math.PI * 2;
      if (k >= 1) {
        d.state = 'onBack'; backGroup.add(d.mesh); d.mesh.rotation.set(0, 0, 0);
        d.vx = -d.x * 0.6; d.vz = -d.z * 0.6; d.teeter = 0; d.scramble = P.scrambleTime;
        // 落背冲击：从哪边跳上来，妈妈就往哪边一沉
        S.rollV += d.mass * d.x / BACK_A * P.hopImpact; S.pitchV += d.mass * d.z / BACK_B * P.hopImpact * 0.8;
        thudSound(S.x); peep(1500, 0.18, S.x); d.mouth = 1; d.land = 1;
        if (d.mass > 1) S.oof = 0.45;   // 胖墩落背：妈妈「呃」地一沉、挤眼
        fx.sparkle(d.mesh.getWorldPosition(new THREE.Vector3()), 4);
      }
    } else if (d.state === 'eaten') {
      // 被拖下水
      d.wp.y -= dt * 0.5; d.mesh.rotation.z += dt * 6;
      if (d.wp.y < -0.35) d.mesh.visible = false;
    } else if (d.state === 'queued') {
      // 落水后排到鸭妈妈身后，跟着游（绿头鸭式）
      const delay = Math.min(S.xHistory.length - 1, (d.queueIdx + 1) * 18);
      const tx = S.xHistory.length ? S.xHistory[S.xHistory.length - 1 - delay] : S.x;
      const tz = S.z + BODY.rz + 0.6 + train().length * 0.42 + d.queueIdx * 0.5;
      d.wp.x += (tx - d.wp.x) * Math.min(1, 3 * dt); d.wp.z += (tz - d.wp.z) * Math.min(1, 2 * dt);
      d.mesh.rotation.x *= 0.9; d.mesh.rotation.z *= 0.9;
      d.mesh.rotation.y += (0 - d.mesh.rotation.y) * Math.min(1, 4 * dt);
    }
  }
  collideDucklings();
  if (!S.arrived) for (const d of ducklings) if (d.state === 'onBack' || d.state === 'floating') S.minWarm = Math.min(S.minWarm, d.warmth);
  // 水里的宝宝：互相推开，也不能钻进妈妈身体的轮廓里
  const sw = ducklings.filter(d => d.state === 'floating' || d.state === 'queued' || d.state === 'stray');
  for (let i = 0; i < sw.length; i++) {
    const a = sw[i];
    for (let j = i + 1; j < sw.length; j++) {
      const b = sw[j], dx = b.wp.x - a.wp.x, dz = b.wp.z - a.wp.z, dd = Math.hypot(dx, dz), minD = 0.15 * (a.scale + b.scale) * (1 + 0.1 * P.chibi);
      if (dd > 1e-4 && dd < minD) { const k = (minD - dd) / dd * 0.5; a.wp.x -= dx * k; a.wp.z -= dz * k; b.wp.x += dx * k; b.wp.z += dz * k; }
    }
    const ex = (a.wp.x - S.x) / (BODY.rx + 0.12), ez = (a.wp.z - S.z) / (BODY.rz + 0.12), er = Math.hypot(ex, ez);
    if (er < 1 && er > 1e-4) { a.wp.x = S.x + ex / er * (BODY.rx + 0.12); a.wp.z = S.z + ez / er * (BODY.rz + 0.12); }
  }
}

function updateWorld(dt) {
  const flow = P.riverSpeed * S.flowMul * journeyFlow();   // 急流里水流加速；快到家时慢慢停下
  S.dist += flow * dt;
  for (const t of riverTexes) t.offset.y += flow * dt / (120 / t.repeat.y);
  S.xHistory.push(S.x); if (S.xHistory.length > 400) S.xHistory.shift();
  shore.update(S.dist, performance.now() / 1000, dt, flow);
  fx.update(dt, flow);
  updateRapids(dt);
  updateOrphans(dt, flow);
  updateDirector(dt);
  updateJourney(dt);
  // 尾迹：妈妈两侧交替冒圈，被水流带走就拉成 V 字
  S.wakeEmit = (S.wakeEmit ?? 0) - dt;
  if (S.wakeEmit <= 0 && curStyle.foam) {
    S.wakeEmit = 0.11; S.wakeSide = -(S.wakeSide || 1);
    fx.ring(S.x + S.wakeSide * 0.5, S.z + 0.55, { r0: 0.12, r1: 0.5, life: 1.4, opacity: 0.32, vx: S.wakeSide * 0.35, sz: 0.8 });
    for (const d of ducklings) if ((d.state === 'floating' || d.state === 'queued') && Math.random() < 0.45)
      fx.ring(d.wp.x, d.wp.z + 0.08, { r0: 0.05, r1: 0.24, life: 0.9, opacity: 0.45 });
  }

  // 漂流物
  S.logTimer -= dt * P.hazardRate;
  if (S.logTimer <= 0 && dayLen() - S.dist > 35) { spawnLog(); S.logTimer = rand(2.2, 4.5) * (P.director ? DIR.logMul : 1); }
  for (let i = logs.length - 1; i >= 0; i--) {
    const l = logs[i]; l.g.position.z += flow * dt * 1.15;
    l.g.position.y = 0.08 + Math.sin(performance.now() / 300 + i) * 0.02;
    const dx = S.x - l.g.position.x, dz = l.g.position.z - S.z;
    if (!l.hit && Math.abs(dz) < 0.9 && Math.abs(dx) < 1.1) {
      l.hit = true; thudSound();
      S.rollV += Math.sign(dx || 1) * P.hitStrength; S.pitchV -= P.hitStrength * 0.8; S.vx += Math.sign(dx || 1) * 1.2;
      splash(new THREE.Vector3(l.g.position.x, 0, l.g.position.z), 8, 0.6);
    }
    if (l.hit) l.g.position.x -= Math.sign(dx || 1) * dt * 1.5;
    if (l.g.position.z > 12) { l.g.removeFromParent(); logs.splice(i, 1); }
  }

  // 皮划艇尾浪
  if (!P.director) {
    S.wakeTimer -= dt * P.hazardRate;
    if (!wake.active && S.wakeTimer <= 0) spawnKayak();
  }
  if (wake.active) {
    wake.t += dt;
    kayak.position.set(S.x + wake.side * 2.6, 0.1, -14 + wake.t * 6);
    paddle.rotation.z = Math.sin(wake.t * 5) * 0.55; paddle.rotation.y = Math.cos(wake.t * 5) * 0.25;
    if (wake.t > 4) { wake.active = false; kayak.visible = false; S.wakeTimer = rand(12, 18); }
  }

  updateHawk(dt);
  updateHeron(dt, flow);
  updateGull(dt);
  updateRain(dt);
  updateLine(dt, flow);
  updateRival(dt, flow);
  updateHatch(dt, flow);

  updateLurker(dt);
  updateMink(dt, flow);
  updateMist(dt);
  updateBridge();
  updateFeathers(dt, flow);

  // 蝴蝶（好奇鬼的目标）
  bfly.timer -= dt; if (bfly.timer <= 0) { bfly.side *= -1; bfly.timer = rand(6, 10); }
  const bt = performance.now() / 1000;
  butterfly.position.lerp(tmpV.set(S.x + bfly.side * 1.1, 1.0 + Math.sin(bt * 2) * 0.15, S.z - 0.1 + Math.sin(bt * 1.3) * 0.3), Math.min(1, dt * 1.5));
  butterfly.visible = RN.k < 0.3;   // 下雨蝴蝶就躲起来了
  bwings[0].rotation.y = Math.sin(bt * 25) * 1.1; bwings[1].rotation.y = -bwings[0].rotation.y;

  // 水花
  for (const p of splashPool) {
    if (p.life <= 0) continue;
    p.life -= dt; p.v.y -= 9.8 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.scale.setScalar(Math.max(0.01, p.life));
    if (p.life <= 0 || p.m.position.y < -0.1) { p.life = 0; p.m.visible = false; }
  }
}

// ---------- 多天旅程：宝宝一天天长大，妈妈从「驮着走」变成「领着走」 ----------
// 依据：雏鸭 14～20 天才能自己保暖；第一周就会潜水；秋沙鸭一家会顺流迁往更大的水域
const DAYS = [
  { age: 1, g: 0, len: 0.75, unlock: [{ at: 18, ev: 'kayak' }, { at: 32, ev: 'orphan' }, { at: 55, ev: 'lurker' }],
    intro: 'The ducklings are just one day old: tiny, easily chilled, and counting on you to carry them.' },
  { age: 3, g: 0.33, len: 0.9, unlock: [{ at: 24, ev: 'rapids' }, { at: 44, ev: 'line' }, { at: 62, ev: 'rain' }],
    intro: 'Three days old now: a little faster, a little hardier.<br>Today the river runs past a village, with rapids and a drop below it, and the sky is clouding over. It may rain.' },
  { age: 7, g: 0.66, len: 1.05, unlock: [{ at: 24, ev: 'hawk' }, { at: 40, ev: 'hatch' }, { at: 58, ev: 'heron' }, { at: 80, ev: 'mist' }],
    intro: 'A week old, and they can dive: when a hawk swoops, the ones in the water hide on their own.<br>They are heavier, your back is getting crowded, and some want to swim by themselves.<br>Herons stand in the shallows along this stretch, mayflies swarm in the evening, and mist settles on the water at dusk.' },
  { age: 12, g: 1, len: 1.2, unlock: [{ at: 16, ev: 'gull' }, { at: 40, ev: 'rival' }, { at: 64, ev: 'mink' }],
    intro: 'Twelve days old. They swim on their own most of the time; you are leading more than carrying.<br>Last leg: down to the big lake, with its gulls and other duck families. Watch the banks for mink.' },
];
const C = { day: 0, roster: [], startRoster: [], nextRoster: null, pending: null };   // roster：家里有哪些宝宝（跨天保留）
// 托儿所（无尽模式）：真实的秋沙鸭会把几窝雏鸭合成一大群，由一只母鸭带着。没有终点，一路收留走散的宝宝，看能带多大一群
const CRECHE_DAY = { age: 5, g: 0.33, len: Infinity, unlock: [] };
const isCreche = () => C.mode === 'creche';
const curDay = () => isCreche() ? CRECHE_DAY : DAYS[Math.min(C.day, DAYS.length - 1)];
const growth = () => curDay().g;
const dayLen = () => P.journeyLen * curDay().len;            // 默认 600 → 450 / 540 / 630 / 720 米
const freezeT = () => P.lostTime * (1 + 1.2 * growth());      // 越大越耐冷
const swimMul = () => 1 + 0.7 * growth();                      // 越大游得越快
const grown = k => ({ ...k, scale: k.scale * (0.85 + 0.45 * growth()), mass: k.mass * (1 + 0.5 * growth()) });
function newCampaign() { C.mode = 'story'; C.day = 0; C.roster = KINDS.map(k => ({ ...k })); C.pending = null; DIR.unlocked = []; }
const ALL_EVENTS = [...new Set(DAYS.flatMap(d => d.unlock.map(u => u.ev)))];
function startCreche() {   // C.day 记成最后一天：难度、拟伤、叠加都按最后一天来
  C.mode = 'creche'; C.day = DAYS.length - 1; C.roster = KINDS.map(k => ({ ...k })); C.pending = null; C.cPiece = 0;
  reset(); S.started = true; book.hide();
}
function backToStory() { newCampaign(); reset(); S.started = false; book.show(titlePage()); }
function proceed() {   // 结算画面点一下：下一天 / 重来这一天 / 新的旅程
  if (C.pending === 'next') { C.roster = C.nextRoster; C.day++; }
  else if (C.pending === 'retry') C.roster = C.startRoster.slice();
  else if (C.pending === 'new') newCampaign();
  else if (C.pending === 'creche') { C.roster = KINDS.map(k => ({ ...k })); C.cPiece = 0; }
  C.pending = null; reset(); S.started = true;
}

// ---------- 节奏编排（导演） ----------
// 热身只有木头 → 按顺序逐个登场（第一次出现给一句怎么应对）→ 之后随机调度：
// 大威胁（水下阴影/急流/鹰）同时只来一个、结束后有喘息；小事件（皮划艇/迷路宝宝）只在平静时来；间隔随时间缩短
const BIG = ['lurker', 'rapids', 'hawk', 'rain', 'heron', 'rival', 'mink', 'mist'], SMALL = ['kayak', 'orphan', 'gull', 'line', 'hatch'];
const HINT = {
  kayak: '皮划艇过来了：它的尾浪会把你晃一下，稳住重心',
  orphan: '有只迷路的宝宝！游到它旁边，它就会跟上来，再嘎！接它上背',
  lurker: '水下有黑影！它只咬水里的宝宝：冒泡前嘎！把宝宝捞上来，或者拐开甩掉它',
  rapids: '前方急流，尽头有落差！躲开礁石，过落差前把宝宝都弄上背',
  hawk: '鹰来了！它俯冲（出现红圈）时嘎！——背上的宝宝缩起来，水里的潜下去',
  rain: '下雨了！只有背中间（妈妈翅膀底下）是干的，外圈的宝宝会越淋越冷',
  heron: '岸边站着苍鹭！别贴着那边的岸游——它缩脖子就是要叼了',
  gull: '海鸥从侧面扑下来了！往另一边歪一下让宝宝滑开，或者嘎！让它们缩起来',
  hatch: '前面有一团蜉蝣！水里的宝宝游进去能饱餐一顿、暖起来；背上的会兴奋地挤到边上去啄——小心别掉下去',
  rival: '岸边那只别家的鸭妈妈护崽很凶：靠太近她会冲过来啄。她立起来张翅时嘎！把她吓回去，或者离那边远点',
  mist: '起雾了！远处看不清；水里的宝宝看不见你会漂散，嘎！一声它们就循着叫声游回来',
  mink: '岸上有只水貂！它会下水追水里的宝宝：先把宝宝捞上背；它冲到跟前时嘎！把它赶走',
  line: '前面漂着一团钓线！缠上脚会把你往那边拽——往反方向使劲歪着蹬，就能踢掉',
};
const DIR = { t: 0, unlocked: [], nextBig: 0, nextSmall: 0, wasBig: false, lastBig: '', logMul: 1.6, condOn: false, condT: 0, layerDone: false };
// 叠加：第 7 天起，雨/急流（环境）进行中再来一只天敌。只配能同时应对的组合（雨天往中间挤 + 嘎！护崽不冲突），从不同时来两只天敌
const LAYER = { rain: ['hawk', 'heron', 'lurker', 'rival', 'gull', 'mink'], rapids: ['hawk', 'gull'], mist: ['heron', 'lurker', 'mink'] };
const predatorActive = () => MK.phase !== 'idle' || L.phase !== 'idle' || hawkState.phase !== 'idle' || HR.phase !== 'idle' || RV.phase !== 'idle' || GL.phase !== 'idle';
function resetDirector() {   // 每天开始：已经登场过的威胁保留（跨天），今天的新威胁按当天的时间表登场
  for (let i = 0; i < Math.min(C.day, DAYS.length); i++) for (const u of DAYS[i].unlock) if (!DIR.unlocked.includes(u.ev)) DIR.unlocked.push(u.ev);   // 前几天的威胁都算见过了（哪怕那天提前到家）
  const hasBig = DIR.unlocked.some(e => BIG.includes(e)), hasSmall = DIR.unlocked.some(e => SMALL.includes(e));

function updateDirector(dt) {

const HOME = ART.buildHome(RIVER_HALF); scene.add(HOME.group);
const HOME_AHEAD = 3.4;   // 到家时小岛在鸭妈妈前方多远（太近会被她的头挡住）
function journeyFlow() {

}

  for (const l of HOME.lily) l.position.y = Math.sin(performance.now() / 800 + l.position.x) * 0.006;

function arrive() {

function homeSpot(i, n, out) {

function dayBadges(home, adoptedToday) {

    }
  }
  for (const r of RP.rocks) {
    r.m.position.z = r.m.userData.u + S.dist;
    const dx = S.x - r.m.position.x, dz = r.m.position.z - S.z;
    if (!r.hit && Math.abs(dz) < 0.7 + r.r * 0.5 && Math.abs(dx) < 0.7 + r.r) {
      r.hit = true; thudSound();
      S.rollV += Math.sign(dx || 1) * P.hitStrength * 1.2; S.pitchV -= P.hitStrength * 0.6; S.vx += Math.sign(dx || 1) * 1.8;
      splash(new THREE.Vector3(r.m.position.x, 0, r.m.position.z), 12, 0.8);
    }
  }
  if (!RP.dropped && uMom <= RP.uA) {   // 越过落差线：往前栽
    RP.dropped = true; RP.landT = 0.32; S.dropT = 0.55;
    S.pitchV += P.dropKick; whooshSound();
    for (const d of ducklings) if (d.state === 'onBack') { d.vz += P.dropSlide * rand(0.8, 1.2); d.vx += rand(-0.2, 0.2); }   // 突然下坠：背上的往前扑
    for (const d of ducklings) if (d.state === 'floating' || d.state === 'queued') {   // 跟游的被冲散、更累
      if (d.state === 'floating') d.warmth = Math.max(0.02, d.warmth - 0.35);
      d.wp.x += rand(-0.6, 0.6); splash(d.wp, 8, 0.6);
    }
  }
  const toDrop = uMom - RP.uA;
  rumbleGain(RP.dropped ? 0.15 * Math.max(0, 1 + toDrop / 4) : THREE.MathUtils.clamp(1 - (toDrop - 1) / (P.rapidsLen + 16), 0.15, 1));
  if (RP.uA + S.dist > 14) { endRapids(); S.rapidsTimer = P.rapidsInterval * rand(0.8, 1.2); }
}

// 鹰：影子由远及近 → 盘旋 → 选最暴露的宝宝（水里的优先，其次背上最靠边的）俯冲 → 没护住就叼走
function hawkTargetPos(d, out) { return d.state === 'onBack' ? d.mesh.getWorldPosition(out) : out.copy(d.wp); }
function pickHawkTarget() {
  let best = null, bs = -1;
  for (const d of ducklings) {
    let sc = -1;
    if (d.state === 'floating' || d.state === 'queued') sc = growth() >= 0.66 ? 0.3 : 2 + Math.random() * 0.5;   // 会潜水了就改抓背上的
    else if (d.state === 'onBack') sc = Math.hypot(d.x / BACK_A, d.z / BACK_B);
    if (sc > bs) { bs = sc; best = d; }
  }
  return best;
}
function spawnHawk() {
  const H = hawkState;
  Object.assign(H, { phase: 'approach', t: 0, side: Math.random() < 0.5 ? -1 : 1, target: null });
  H.from.set(S.x + H.side * 4.5, 0, S.z - 3.5); H.pos.copy(H.from); H.ang = Math.atan2(-1, -H.side);
  hawk.visible = true;
}
function updateHawk(dt) {
  const H = hawkState;
  hawkRing.visible = false;
  if (H.phase === 'idle') {
    if (!P.director) { S.hawkTimer -= dt * P.hazardRate; if (S.hawkTimer <= 0) spawnHawk(); }
    return;
  }
  H.t += dt;
  const prev = tmpV.copy(H.pos);
  let height = 3.2, shadowS = 1.2, shadowO = 0.35, flap = Math.sin(H.t * 9) * 0.35;
  const circlePos = (a) => new THREE.Vector3(S.x + Math.cos(a) * 1.9, 0, S.z + Math.sin(a) * 1.5);
  if (H.phase === 'approach') {   // 由远及近：影子越来越大
    const k = Math.min(1, H.t / 1.2);
    H.pos.lerpVectors(H.from, circlePos(H.ang), k * (2 - k));
    shadowS = 0.4 + 0.8 * k; shadowO = 0.35 * k;
    if (k >= 1) { H.phase = 'circle'; H.t = 0; screechSound(); }
  } else if (H.phase === 'circle') {   // 盘旋：给玩家看清楚、做准备
    H.ang += dt * 2.4 * H.side;
    H.pos.copy(circlePos(H.ang));
    flap *= 0.3;
    if (H.t >= P.hawkCircle) {
      H.target = pickHawkTarget();
      if (!H.target) { H.phase = 'leave'; H.t = 0; }
      else { H.phase = 'dive'; H.t = 0; H.from.copy(H.pos); screechSound(); }
    }
  } else if (H.phase === 'dive') {   // 俯冲：影子收向目标，红圈预警
    const d = H.target, k = Math.min(1, H.t / P.hawkWarn);
    const tp = hawkTargetPos(d, new THREE.Vector3());
    H.pos.lerpVectors(H.from, tp, k * k);
    height = 3.2 * (1 - k * k) + 0.4; shadowS = 1.2 - 0.6 * k; shadowO = 0.35 + 0.25 * k; flap = -0.5;
    hawkRing.visible = !!P.debugUI; hawkRing.position.set(tp.x, d.state === 'onBack' ? tp.y + 0.02 : 0.04, tp.z);
    hawkRing.scale.setScalar(1 + 0.25 * Math.sin(performance.now() / 60));
    if (k >= 1) {
      const selfDive = growth() >= 0.66 && (d.state === 'floating' || d.state === 'queued');   // 7 天大的宝宝会自己潜水
      const exposed = !(S.cover > 0) && !selfDive && ['onBack', 'floating', 'queued', 'hopping', 'falling'].includes(d.state);
      if (exposed) {
        if (d.state === 'onBack' || d.state === 'hopping') { d.mesh.getWorldPosition(d.wp); scene.attach(d.mesh); }
        d.state = 'carried'; d.teeter = 0; S.eaten++;
        peep(3400, 0.25); screechSound(); splash(tp, 10, 0.6);
        if (P.slowMoOnFall) S.slowMo = 0.5;
        H.phase = 'carry';
      } else {   // 扑空：一头栽空、翻个跟头、掉一根毛，狼狈地飞走；妈妈回头看它
        whooshSound(); fx.ring(tp.x, tp.z, { r0: 0.2, r1: 1.4, life: 0.6, opacity: 0.6, drift: 0 });
        H.phase = 'leave'; H.bonk = 0.9; dropFeather(tp.x, 1.1, tp.z, 0x7a6450); setTimeout(() => dropFeather(tp.x + 0.2, 1.3, tp.z - 0.1, 0xe8dfcf), 120);
        deadpan(1.2);
      }
      H.t = 0; H.from.copy(H.pos);
    }
  } else {   // carry / leave：往外飞出画面
    const away = Math.atan2(H.pos.z - S.z, H.pos.x - S.x);
    H.pos.x += Math.cos(away) * 3.5 * dt; H.pos.z += Math.sin(away) * 3.5 * dt - P.riverSpeed * 0.3 * dt;
    height = 0.4 + H.t * 2.6; shadowO = 0.6 * Math.max(0, 1 - H.t / 1.2); shadowS = 0.6 + H.t * 0.4;
    flap = Math.sin(H.t * 14) * 0.6;
    if (H.phase === 'carry' && H.target) {
      H.target.wp.set(H.pos.x, height - 0.3, H.pos.z);
      if (H.t > 1.3) { H.target.state = 'eaten'; H.target.mesh.visible = false; H.target.wp.y = -1; }
    }
    if (H.t > 1.4) { H.phase = 'idle'; hawk.visible = false; hawkShadow.material.opacity = 0; H.target = null; S.hawkTimer = rand(14, 22); return; }
  }
  const dx = H.pos.x - prev.x, dz = H.pos.z - prev.z;
  if (Math.hypot(dx, dz) > 1e-4) H.heading = Math.atan2(-dx, -dz);
  hawkShadow.position.set(H.pos.x, 0.03, H.pos.z); hawkShadow.rotation.z = H.heading;
  hawkShadow.scale.setScalar(shadowS); hawkShadow.material.opacity = shadowO;
  H.bonk = Math.max(0, (H.bonk || 0) - dt);
  hawk.position.set(H.pos.x, height + Math.sin(H.t * 4) * 0.08, H.pos.z); hawk.rotation.set(0, H.heading, 0);
  if (H.bonk > 0) { const k = H.bonk / 0.9; hawk.rotateZ((1 - k) * Math.PI * 2 * H.side); hawk.rotateX(Math.sin(H.bonk * 30) * 0.3 * k); flap = Math.sin(H.t * 30) * 0.9; }   // 扑空：翻一圈、乱扑腾
  for (const w of hawk.userData.wings) w.rotation.z = w.userData.side * flap;
}

// ---------- 下雨：一阵 20～30 秒的阵雨 ----------
// 依据：雏鸭头两周靠妈妈保暖，绒毛没有妈妈的油脂不防水；冷雨是第一周雏鸭死亡的头号原因，母鸭会张开翅膀把它们捂在身下
const RN = { on: false, t: 0, dur: 0, k: 0, drip: 0 };
function startRain() { Object.assign(RN, { on: true, t: 0, dur: rand(24, 32) }); }
function updateRain(dt) {
  RN.t += dt;
  if (RN.on && RN.t > RN.dur) RN.on = false;
  RN.k = THREE.MathUtils.clamp(RN.k + (RN.on ? 1 : -1) * dt / 3, 0, 1);   // 雨慢慢下大、慢慢停
  rainGain(RN.k);
  if (RN.k <= 0.05) return;
  RN.drip -= dt;
  while (RN.drip < 0) {   // 雨点打在水面上的小圈
    RN.drip += 0.025 / RN.k;
    fx.ring(rand(-RIVER_HALF + 0.3, RIVER_HALF - 0.3), S.z + rand(-9, 5), { r0: 0.02, r1: 0.16, life: 0.45, opacity: 0.4 * RN.k });
  }
}

// ---------- 钓线：一团被丢弃的鱼线漂下来，压上去就缠住一只脚 ----------
// 依据：废弃的钓鱼线在水里几乎看不见，是水鸟被缠伤、缠死的常见原因。应对：躲开；缠上了就往反方向蹬
const FL = { phase: 'idle', x: 0, z: 0, side: 1, t: 0, prog: 0, kick: 0 };
function spawnLine() {
  // 漂在妈妈前方、偏一点：不躲就会压上
  Object.assign(FL, { phase: 'drift', x: THREE.MathUtils.clamp(S.x + rand(-0.8, 0.8), -RIVER_HALF + 0.8, RIVER_HALF - 0.8), z: S.z - 16, t: 0, prog: 0 });
  tangle.visible = true; tangle.rotation.y = rand(0, Math.PI * 2);
}
function freeLine() {
  if (TUT.cur === 'kick') learn('kick');
  FL.phase = 'free'; FL.t = 0; lineTrail.visible = false;
  splash(new THREE.Vector3(S.x + FL.side * 0.4, 0, S.z + 0.9), 10, 0.6); fx.sparkle(new THREE.Vector3(S.x + FL.side * 0.4, 0.4, S.z + 0.9), 4); bloop(600, 0.12);
}
function updateLine(dt, flow) {
  if (FL.phase === 'idle') return;
  FL.t += dt;
  const bob = tangle.userData.bob;
  bob.position.y = 0.03 + Math.sin(FL.t * 5) * 0.02;
  if (FL.phase === 'drift' || FL.phase === 'free') {
    FL.z += flow * dt;
    if (FL.phase === 'drift' && !S.arrived && Math.abs(FL.x - S.x) < 0.75 && Math.abs(FL.z - (S.z + 0.5)) < 0.7) {   // 压上了：缠住离它近的那只脚
      FL.phase = 'snag'; FL.side = Math.sign(FL.x - S.x) || 1; FL.prog = 0; FL.t = 0;
      thudSound(); bloop(180, 0.18); lineTrail.visible = true;
    }
    if (FL.z > S.z + 9) { FL.phase = 'idle'; tangle.visible = false; return; }
    tangle.position.set(FL.x, 0, FL.z);
  } else if (FL.phase === 'snag') {
    // 往反方向蹬（鼠标推向另一边）：进度涨；松开就慢慢回落
    const kicking = mouse.x * FL.side < -0.45;
    FL.prog = THREE.MathUtils.clamp(FL.prog + (kicking ? dt / P.lineFree : -dt * 0.4), 0, 1);
    FL.kick -= dt;
    if (kicking && FL.kick <= 0) { FL.kick = 0.22; fx.ring(S.x + FL.side * 0.45, S.z + 0.9, { r0: 0.05, r1: 0.35, life: 0.5, opacity: 0.55 }); }   // 蹬出的水花
    // 线团拖在身后那一侧，越蹬抖得越厉害
    FL.x = S.x + FL.side * 0.55 + Math.sin(FL.t * 3) * 0.08 + (kicking ? Math.sin(FL.t * 30) * 0.06 : 0);
    FL.z = S.z + 1.7 + Math.sin(FL.t * 2.3) * 0.1;
    tangle.position.set(FL.x, 0, FL.z);
    const footW = duck.localToWorld(tmpV.set(FL.side * 0.3, -0.05, 0.75));
    const arr = lineTrail.geometry.attributes.position.array;
    for (let i = 0; i < 12; i++) {
      const k = i / 11, sag = Math.sin(k * Math.PI) * (0.12 - 0.1 * FL.prog);   // 越蹬越绷紧
      arr[i * 3] = footW.x + (FL.x - footW.x) * k + sag * FL.side; arr[i * 3 + 1] = footW.y * (1 - k) + 0.03 * k; arr[i * 3 + 2] = footW.z + (FL.z - footW.z) * k;
    }
    lineTrail.geometry.attributes.position.needsUpdate = true;
    if (FL.prog >= 1) freeLine();
  }
}

// ---------- 蜉蝣羽化：河面上一团虫子，水里的宝宝游进去能吃饱、暖起来；背上的会挤到边上去啄 ----------
// 依据：初夏河面常有蜉蝣成群羽化；雏鸭头几周主要吃水面和水里的小虫，是长身体的关键食物
const HT = { on: false, x: 0, z: 0, r: 1.6, t: 0, k: 0, feed: 0 };
function spawnHatch() { Object.assign(HT, { on: true, x: rand(-1, 1) * (RIVER_HALF - 1.6), z: S.z - 15, t: 0 }); }
const hatchNear = () => HT.on && Math.hypot(HT.x - S.x, HT.z - S.z) < HT.r + 0.6;
function eatBug(d, at) {   // 啄到一只：叽一声、冒个小星星、暖一点
  S.fed++; d.log.bugs++; d.mouth = 1; d.warmth = Math.min(1, d.warmth + 0.08);
  peep(2200 + Math.random() * 600, 0.08); fx.sparkle(at, 1);
}
function updateHatch(dt, flow) {
  HT.t += dt;
  HT.k = THREE.MathUtils.clamp(HT.k + (HT.on ? 1 : -1) * dt / 1.2, 0, 1);
  hatchFx.update(HT.t, HT.x, HT.z, HT.r, HT.k);
  if (!HT.on) return;
  HT.z += flow * dt;
  // 水里的宝宝在虫群里：一口一口地吃
  HT.feed -= dt;
  if (HT.feed <= 0) {
    HT.feed = 0.35;
    for (const d of ducklings) if ((d.state === 'floating' || d.state === 'queued') && Math.hypot(d.wp.x - HT.x, d.wp.z - HT.z) < HT.r && Math.random() < 0.6) eatBug(d, d.wp.clone().setY(0.25));
  }
  if (HT.z > S.z + 7) HT.on = false;
}

// ---------- 别家的鸭妈妈：带着自家孩子待在岸边的湾里，靠太近就冲过来啄 ----------
// 依据：带雏的雌鸭领地性很强，常追啄、按水淹陌生的雏鸭，也会冲撞别的成鸭；对方摆出威胁姿态（这里是嘎！）时常常退让
const RV = { phase: 'idle', x: 0, z: 0, cx: 0, cz: 0, side: 1, t: 0, cd: 0, target: null, yaw: 0, rear: 0, wing: 0 };
function spawnRival() {
  const side = Math.random() < 0.5 ? -1 : 1;
  Object.assign(RV, { phase: 'rest', side, cx: side * (RIVER_HALF - 0.9), cz: S.z - 16, t: 0, cd: 0, target: null, rear: 0, wing: 0, yaw: 0 });
  RV.x = RV.cx; RV.z = RV.cz;
  hen.visible = true; henBrood.forEach(m => m.visible = true);
}
function updateRival(dt, flow) {
  if (RV.phase === 'idle') return;
  RV.t += dt; RV.cd -= dt; RV.cz += flow * dt; RV.z += flow * dt;   // 她和她的湾都跟着河水漂过来（下面的游动是相对水的）
  const ease = (a, b, k) => a + (b - a) * Math.min(1, k * dt);
  const swimTo = (tx, tz, sp) => { const dx = tx - RV.x, dz = tz - RV.z, l = Math.hypot(dx, dz); if (l > 1e-3) { const st = Math.min(l, sp * dt); RV.x += dx / l * st; RV.z += dz / l * st; RV.yaw = Math.atan2(-dx, -dz); } return l; };
  const nearestSwimmer = (r) => { let best = null, bd = r; for (const d of ducklings) if (d.state === 'floating' || d.state === 'queued') { const dd = Math.hypot(d.wp.x - RV.x, d.wp.z - RV.z); if (dd < bd) { bd = dd; best = d; } } return best; };
  let rearT = 0, wingT = 0;
  if (RV.phase === 'rest' || RV.phase === 'back' || RV.phase === 'retreat') {
    const l = swimTo(RV.cx, RV.cz, RV.phase === 'retreat' ? 3.2 : 1.6);
    if (RV.phase !== 'rest' && l < 0.15) { RV.phase = 'rest'; RV.cd = RV.cd > 0 ? RV.cd : 2.5; }
    if (RV.phase === 'retreat') RV.cd = 4;
    if (RV.phase === 'rest') RV.yaw = ease(RV.yaw, Math.atan2(RV.side, 0.2) + Math.sin(RV.t * 0.6) * 0.5, 2);
    if (RV.phase === 'rest' && RV.cd <= 0 && !S.arrived && (Math.hypot(S.x - RV.x, S.z - RV.z) < P.rivalRange || nearestSwimmer(P.rivalRange * 0.9))) {
      RV.phase = 'warn'; RV.t = 0; hissSound();
    }
    if (RV.cz > S.z + 10) { RV.phase = 'idle'; hen.visible = false; henBrood.forEach(m => m.visible = false); return; }
  } else if (RV.phase === 'warn') {   // 立起来、张翅、嘶：马上要冲
    rearT = 1; wingT = 0.8 + Math.sin(RV.t * 20) * 0.1;
    RV.yaw = ease(RV.yaw, Math.atan2(-(S.x - RV.x), -(S.z - RV.z)), 8);
    if (RV.t >= P.rivalWarn) { RV.phase = 'charge'; RV.t = 0; RV.target = nearestSwimmer(4); }
  } else if (RV.phase === 'charge') {   // 贴着水面扑腾着冲过来
    wingT = 0.6 + Math.abs(Math.sin(RV.t * 18)) * 0.4;
    const d = RV.target && (RV.target.state === 'floating' || RV.target.state === 'queued') ? RV.target : null;
    const tx = d ? d.wp.x : S.x + Math.sign(RV.x - S.x) * (BODY.rx + 0.25), tz = d ? d.wp.z : S.z;
    const l = swimTo(tx, tz, 4.2);
    if (Math.random() < dt * 14) fx.ring(RV.x, RV.z + 0.3, { r0: 0.05, r1: 0.3, life: 0.4, opacity: 0.5 });
    if (l < 0.3) {
      if (d) {   // 啄水里的宝宝：被推开、按一下水，冷了一截
        const ax = d.wp.x - RV.x, az = d.wp.z - RV.z, al = Math.hypot(ax, az) || 1;
        d.wp.x += ax / al * 0.9; d.wp.z += az / al * 0.9; d.warmth = Math.max(0, d.warmth - 0.35);
        peep(3000, 0.22); d.mouth = 1; splash(d.wp, 12, 0.7);
      } else {   // 撞妈妈的身侧：被顶得一歪
        const sgn = Math.sign(S.x - RV.x) || 1;
        S.rollV += sgn * P.rivalBump; S.vx += sgn * 1.2; thudSound(); splash(new THREE.Vector3(S.x - sgn * 0.6, 0, S.z), 10, 0.6);
      }
      RV.phase = 'back'; RV.t = 0; RV.cd = 3;
    } else if (RV.t > 1.6) { RV.phase = 'back'; RV.t = 0; RV.cd = 2; }
  }
  RV.rear = ease(RV.rear, rearT, 10); RV.wing = ease(RV.wing, wingT, 12);
  hen.position.set(RV.x, Math.sin(RV.t * 2) * 0.02, RV.z); hen.rotation.y = RV.yaw;
  hen.userData.pose(RV.rear, RV.wing);
  // 她的孩子留在湾里，挨在一起转圈游
  const tt = performance.now() / 1000;
  henBrood.forEach((m, i) => {
    const a = tt * 0.7 + i * 2.1;
    m.position.set(RV.cx + Math.cos(a) * 0.45 - RV.side * 0.15, 0.02, RV.cz + 0.5 + Math.sin(a) * 0.3);
    m.rotation.y = -a;
    ART.animateDuckling(m.children[0], tt, { seed: i * 0.37, swimming: true, amt: P.chibi });
  });
}

// ---------- 苍鹭：站在岸边浅水里（跟着河岸漂过来），离岸太近的宝宝会被叼走 ----------
// 依据：苍鹭在浅水岸边伏击，雏鸭是常见猎物；它出击前会把脖子缩成 S 形。应对：离那边的岸远一点
const HR = { phase: 'idle', x: 0, z: 0, side: 1, t: 0, target: null, cd: 0, yaw: 0, len: 1, pitch: 0.15, tp: new THREE.Vector3(), splash: 0 };
// ---------- 水貂：沿着岸边一蹿一蹿地跑过来，溜下水，追水里的宝宝；冲到妈妈跟前时嘎！妈妈会扑过去把它赶走 ----------
// 依据：美洲水貂沿河岸捕猎、水性好，会抓雏鸭；母鸭遇到小型天敌常常主动冲上去扑打、溅水把它赶跑
const MK = { phase: 'idle', x: 0, z: 0, side: 1, t: 0, target: null, yaw: 0, k: 0, wakeT: 0 };
const WATER_PREY = ['floating', 'queued', 'stray'];
function spawnMink() {
  const side = Math.random() < 0.5 ? -1 : 1;
  Object.assign(MK, { phase: 'run', side, x: side * (RIVER_HALF - 0.4), z: S.z - 13, t: 0, target: null, yaw: 0, k: 0 });
  mink.visible = true;
}
function minkScare() {   // 妈妈扑过去：水貂吓一跳、掉头游回岸上
  if (MK.phase !== 'swim' && MK.phase !== 'lunge') return false;
  MK.phase = 'flee'; MK.t = 0; MK.target = null; hissSound(MK.x); splash(new THREE.Vector3(MK.x, 0, MK.z), 10, 0.6);
  deadpan(1);
  return true;
}
function updateMink(dt, flow) {

  // 头：鸟会稳住头部（抵消身体倾斜），没事时左右张望；嘎！时伸脖子张嘴
  const q = S.flap > 0 ? Math.sin(Math.min(1, (0.5 - S.flap) / 0.12) * Math.PI / 2) * Math.min(1, S.flap / 0.15) : 0;
  // 回头看宝宝：有宝宝扒边/落水就扭头盯着它（鸟脖子能转 180°），平时也隔一阵回头瞄一眼——这样玩家才看得到她的脸
  let look = null;
  const threatened = hawkState.phase === 'dive' ? hawkState.target : L.phase === 'windup' ? L.target : HR.phase === 'cock' ? HR.target : GL.phase === 'swoop' ? GL.target : MK.phase === 'lunge' ? MK.target : null;   // 鹰/水下黑影盯上的宝宝：妈妈先盯着它
  if (threatened) look = threatened.state === 'onBack' ? threatened.mesh.position : duck.worldToLocal(tmpV.copy(threatened.wp));
  else if (FL.phase === 'snag') look = duck.worldToLocal(tmpV.set(FL.x, 0, FL.z));   // 回头瞅缠住脚的线
  if (!look) for (const d of ducklings) {
    if (d.state === 'onBack' && d.teeter > 0) { look = d.mesh.position; break; }
    if (!look && (d.state === 'falling' || d.state === 'floating')) look = duck.worldToLocal(tmpV.copy(d.wp));
  }
  let yaw = Math.sin(t * 0.7) * 0.3 * Math.sin(t * 0.23);
  if (!look && (t % 6.5) > 5.2) look = tmpV.set(Math.sin(t * 0.37) > 0 ? 0.3 : -0.3, 0, 0.6);   // 闲着时回头瞄一眼
  if (look) {
    const hb0 = head.userData.base;
    yaw = THREE.MathUtils.clamp(Math.atan2(-(look.x - hb0.x), -(look.z - hb0.z)), -2.1, 2.1);   // 最多回头 120°：再往后大嘴会扫过背上的宝宝
  }
  if (threatened) S.stare = 0;
  if (S.stare > 0) yaw = S.stareSide * 2.05;   // 冷面：扭头盯着镜头
  S.headYaw = (S.headYaw ?? 0) + (yaw - (S.headYaw ?? 0)) * Math.min(1, realDt * 7);
  head.rotation.set((S.flap > 0 ? -Math.sin(S.flap * 20) * 0.15 : 0) + S.pitch * 0.5 - q * 0.25, S.headYaw, S.roll * 0.6);
  // 游泳时一点一点地点头；嘎！时伸长脖子、冠羽炸毛；偶尔眨眼
  const hb = head.userData.base, bob = Math.sin(t * 4.4);
  const lookBack = THREE.MathUtils.smoothstep(Math.abs(S.headYaw), 1.0, 2.1);   // 回头时把头抬高，越过背上的宝宝
  head.position.set(0, hb.y + bob * 0.015 + q * 0.12 + lookBack * 0.12, hb.z - Math.max(0, bob) * 0.025 - q * 0.16 + lookBack * 0.05);
  M.update();   // 脖子是一整根管子，跟着头伸缩
  // 冠羽 = 嘎！的冷却：冷却中趴下去，好了「噗」地竖起来（加一声轻响）
  const cdK = P.quackCooldown > 0 ? S.quackCd / P.quackCooldown : 0;
  if (S.wasCd && cdK <= 0) { S.crestPop = 0.35; bloop(520, 0.08); }
  S.wasCd = cdK > 0; S.crestPop = Math.max(0, (S.crestPop || 0) - realDt);
  const pop = Math.sin((S.crestPop / 0.35) * Math.PI) * 0.35;
  M.crest.scale.set(1 + q * 0.35 + pop * 0.5, (1 + q * 0.6 + pop) * (1 - 0.45 * cdK), 1 + q * 0.35);
  const blink = (t % 3.7) < 0.12 || ((t + 1.3) % 7.9) < 0.12;
  const lid = S.oof > 0 ? 0.2 : S.stare > 0 ? 0.45 : 1;   // 冷面 = 半垂眼皮；被胖墩压 = 挤成一条缝
  for (const e of M.eyes) e.scale.y = blink ? 0.15 : lid;
  M.body.scale.y = BODY.ry * (1 + bob * 0.02);
  jaw.rotation.x = -0.5 * q;
  M.tail.rotation.y = Math.sin(t * 2.6) * 0.12 + S.rollV * 0.03;
  M.crest.rotation.x = Math.sin(t * 3.1) * 0.06 * (1 - cdK) - q * 0.2 + cdK * 0.7;   // 冷却中往后贴着脑袋
  if (S.display > 0) for (const w of wings) w.rotation.z = w.userData.side < 0 ? -(1.25 + Math.sin(t * 9) * 0.1) : Math.abs(Math.sin(t * 28)) * 1.3;   // 装受伤：一只翅膀耷拉着拖在水上，另一只拼命扑
  else for (const w of wings) w.rotation.z = w.userData.side * (S.flap > 0.25 ? Math.abs(Math.sin(S.flap * 25)) * 1.1
    : S.cover > 0 ? 0.6 + Math.sin(t * 30) * 0.04 : S.flap > 0 ? Math.abs(Math.sin(S.flap * 25)) * 1.1 : 0.05 + 0.3 * RN.k);   // 下雨：微微张开翅膀把宝宝捂住   // 护崽时半张翅膀

  for (const d of ducklings) {
    d.mouth = (d.mouth || 0) - realDt * 5; d.land = (d.land || 0) - realDt * 4;
    // 失温：身体和头变蓝；材质每只单独一份（切风格后会被换回共享材质，这里自动重新克隆）
    const inner = d.mesh.children[0], bodyM = inner.children[0], headM = inner.userData.head.children[0];
    if (bodyM.material !== d.tintMat) {
      d.tintMat = bodyM.material.clone(); d.tintBase = bodyM.material.color.clone(); d.tintEm = bodyM.material.emissive.clone();
      bodyM.material = headM.material = d.tintMat;
    }
    const cold = Math.pow(1 - d.warmth, 0.8) * 0.85;
    d.tintMat.color.copy(d.tintBase).lerp(COLD_TINT, cold); d.tintMat.emissive.copy(d.tintEm).multiplyScalar(1 - cold);
    d.label.visible = P.showLabels && d.state === 'onBack';
    if (d.state === 'onBack') d.strayLbl.visible = false;
    if (d.state === 'onBack') {
      d.mesh.position.set(d.x, backHeight(d.x, d.z), -d.z);
      const sp = Math.hypot(d.vx, d.vz);
      if (sp > 0.05) d.heading = Math.atan2(-d.vx, d.vz);
      else if (!d.sleeping) {   // 停下来时慢慢转身东张西望，脸才有机会朝向镜头
        d.idleT = (d.idleT ?? 0) - realDt;
        if (d.idleT <= 0) { d.idleT = (1.5 + Math.random() * 2.5) * (2 - P.chibi); d.idleHeading = d.heading + (Math.random() - 0.5) * (1 + 2.5 * P.chibi); }
        d.heading += ((d.idleHeading ?? d.heading) - d.heading) * Math.min(1, realDt * 3);
      }
      d.mesh.rotation.set(0, d.heading, 0);
      d.mesh.children[0].position.y = sp > 0.05 && !d.sleeping ? Math.abs(Math.sin(t * 18 + d.x * 10)) * 0.03 : 0;
      d.zz.visible = d.sleeping && d.teeter === 0;
      d.help.visible = d.teeter > 0;
      d.coldLbl.visible = d.teeter === 0 && d.warmth < 0.5;   // 背上还没暖过来的
      if (d.coldLbl.visible) { d.label.visible = false; d.zz.visible = false; }
      if (d.teeter > 0) { d.label.visible = false; d.mesh.children[0].rotation.z = Math.sin(t * 45) * 0.45; d.mesh.children[0].position.y = Math.abs(Math.sin(t * 30)) * 0.05; }
      else d.mesh.children[0].rotation.z = sp > 0.05 && !d.sleeping ? Math.sin(t * 18 + d.x * 10) * 0.1 : 0;   // 走路一摇一摆
      // 越靠近边缘越慌：啾声更高更急、翅芽乱扑
      const r = Math.hypot(d.x / BACK_A, d.z / BACK_B);
      ART.animateDuckling(d.mesh.children[0], t, { seed: d.seed ??= Math.random(), moving: sp > 0.05 && !d.sleeping, sleeping: d.sleeping, panic: d.teeter > 0 || r > 0.85,
        peep: Math.max(0, d.mouth || 0), land: Math.max(0, d.land || 0), amt: P.chibi, crouch: S.cover > 0 ? 1 : 0, cold: 1 - d.warmth, sneeze: d.sneeze,
        lookUp: (hawkState.phase === 'dive' && hawkState.target === d) || (GL.phase === 'swoop' && GL.target === d) || (HR.phase === 'cock' && HR.target === d) });
      if (d.warmth < 0.5 && simDt > 0 && Math.random() < simDt * 0.5) { coldPeep(1900, 0.04, S.x + d.x); d.mouth = 1; }   // 背上还冷着：小声打颤
      d.peepCd -= simDt;
      if (r > 0.72 && d.peepCd <= 0) { peep(1700 + r * 1500, 0.06 + r * 0.06, S.x + d.x); d.peepCd = 0.6 - r * 0.4 + Math.random() * 0.2; d.mouth = 1; }
      else if (!d.sleeping && Math.random() < simDt * 0.12 * P.chibi) { peep(2300 + Math.random() * 600, 0.025, S.x + d.x); d.mouth = 1; }   // 闲着偶尔叽一声
    } else {

      if (d.state === 'home' || d.state === 'homing') d.zz.visible = d.coldLbl.visible = false;
      if (d.state === 'home') d.mesh.rotation.set(0, Math.PI + Math.sin(t * 1.3 + d.homeIdx) * 0.3, 0);   // 到家：转过来面朝镜头
      else if (d.state === 'homing') d.mesh.rotation.set(-Math.min(1, d.hopT) * Math.PI * 2, Math.PI, 0);
      if (d.state === 'stray') { d.mesh.position.y = 0.02 + Math.abs(Math.sin(t * 8 + d.wp.x * 5)) * 0.05; d.mesh.rotation.y = Math.sin(t * 1.5 + d.wp.x) * 0.8; }

        d.mesh.children[0].rotation.z = Math.sin(t * 20 + d.z * 5) * 0.35;
      } else if (d.state === 'queued') {

      d.help.visible = d.help.visible && !(S.cover > 0);
      const showCold = d.help.visible && d.warmth < 0.6;   // 冷了：「救我！」换成「❄ 好冷」
      d.coldLbl.visible = showCold; if (showCold) d.help.visible = false;
      if (d.startle > 0) d.mesh.position.y += Math.sin((1 - d.startle / 0.45) * Math.PI) * 0.35;   // 惊醒：原地一蹦

      ART.animateDuckling(d.mesh.children[0], t, { seed: d.seed ??= Math.random(), swimming: !dozing && (d.state === 'floating' || d.state === 'queued' || d.state === 'stray'), sleeping: dozing,
        panic: !dozing && (d.state === 'falling' || d.state === 'floating' || d.state === 'carried' || d.state === 'stray' || (L.phase === 'windup' && L.target === d)),
        peep: Math.max(0, d.mouth || 0), stretch: d.state === 'hopping' ? Math.sin(Math.min(1, d.hopT) * Math.PI) : 0, amt: P.chibi, cold: 1 - d.warmth,
        lookUp: (hawkState.phase === 'dive' && hawkState.target === d) || (GL.phase === 'swoop' && GL.target === d) || (HR.phase === 'cock' && HR.target === d) });
      // 求救的叫声：落水的宝宝隔一会儿叫一声；越冷叫得越慢、越低、越虚、带颤音
      if (d.state === 'floating' && !dozing && !(S.cover > 0) && simDt > 0) {

    }
    if (!P.debugUI) { d.help.visible = d.coldLbl.visible = d.strayLbl.visible = d.zz.visible = false; }   // 具身化 UI：不显示文字标签
    if (!P.showLabels) d.label.visible = false;

  // 背部警示色：宝宝越靠边越红
  let maxR = 0;

  const danger = THREE.MathUtils.clamp((maxR - 0.72) / 0.25, 0, 1);   // 平时看不见，只有宝宝快到边上时才泛红（不像界面元素）
  backPatch.material.color.copy(PATCH_SAFE).lerp(PATCH_DANGER, danger);
  backPatch.material.opacity = 0.5 * danger; backPatch.visible = danger > 0.01;

  if (foam.visible) {
    foam.position.set(S.x, riverC.visible ? 0.05 : 0.02, S.z + 0.05);

  }
  if (riverC.visible) updateRiverC(t);

    scene.background.set(curStyle.bg).lerp(SUNSET.bg, f); scene.fog.color.copy(scene.background);

      scene.background.lerp(RAINY.bg, 0.65 * RN.k); scene.fog.color.copy(scene.background);
      sun.intensity *= 1 - 0.45 * RN.k; hemi.color.lerp(RAINY.sky, 0.5 * RN.k);

  }

  waterA.uniforms.uRapA.value = RP.uA; waterA.uniforms.uRapB.value = RP.uB; waterA.uniforms.uRapOn.value = RP.on ? 1 : 0; waterA.uniforms.uFocusAmt.value = P.focus ? 1 : 0;

  document.getElementById('onBack').textContent = onBack;
  document.getElementById('total').textContent = ducklings.filter(d => d.state !== 'eaten' && d.state !== 'carried' && d.state !== 'stray').length;
  document.getElementById('adopted').textContent = S.adopted;
  document.getElementById('saves').textContent = S.saves;
  document.getElementById('catches').textContent = S.catches;
  document.getElementById('eaten').textContent = S.eaten;
  const rem = isCreche() ? 0 : Math.max(0, dayLen() - S.dist), frac = isCreche() ? 0 : Math.min(1, S.dist / dayLen());

  document.getElementById('progFill').style.width = (frac * 100) + '%';
  document.getElementById('progDuck').style.left = (frac * 100) + '%';
  document.getElementById('cdFill').style.width = (100 * (1 - S.quackCd / P.quackCooldown)) + '%';

  if (!S.over && !S.arrived && S.started && onBack === 0 && ducklings.every(d => d.state === 'queued' || d.state === 'eaten' || d.state === 'stray' || d.state === 'carried')) {

    const allTaken = S.eaten === ducklings.filter(d => d.state !== 'stray').length, left = Math.ceil(dayLen() - S.dist);

      lines: allTaken ? [`Every duckling was taken... ${left} m from home.`]
        : [`All the ducklings ended up in the water, too cold to keep up. ${left} m from home.`, ...(S.eaten ? [`${S.eaten} taken by predators.`] : [])],
      ...fieldNotes([allTaken ? 'odds' : 'rain']), footer: `(click to try Day ${curDay().age} again)` });
  }
}

// ---------- 教学：不写字，在需要的那一刻把操作图标放到鸭妈妈旁边，做到了就消失（学会的存下来，下次不再教） ----------
let taught = {}; try { taught = JSON.parse(localStorage.getItem('duckShiftTaught') || '{}'); } catch (e) {}
const TUT = { cur: null, slow: false, t: 0, left: false, right: false, quacked: false, pos: new THREE.Vector3() };
function learn(k) {
  taught[k] = true; try { localStorage.setItem('duckShiftTaught', JSON.stringify(taught)); } catch (e) {}
  if (TUT.cur === k) { fx.sparkle(TUT.pos.clone(), 5); bloop(760, 0.1); TUT.cur = null; glyph.hide(); TUT.slow = false; }
}
function updateTutorial(realDt) {
  if (!S.started || S.over || S.arrived || S.paused || book.visible) { glyph.hide(); TUT.slow = false; TUT.cur = null; return; }
  const want =
    !taught.tilt && C.day === 0 && S.time > 0.6 ? 'tilt' :                         // 开局：先学会歪身子
    !taught.kick && FL.phase === 'snag' ? 'kick' :                                  // 第一次被钓线缠住：往另一边蹬
    !taught.cover && hawkState.phase === 'dive' ? 'cover' :                         // 第一次鹰俯冲：嘎！护崽
    !taught.hold && C.day >= 1 && S.displayCd <= 0 && (L.phase === 'windup' || HR.phase === 'cock' || RV.phase === 'warn') ? 'hold' :   // 嘎！管不了的危险：按住装受伤
    !taught.scare && (MK.phase === 'swim' || MK.phase === 'lunge') && Math.hypot(MK.x - S.x, MK.z - S.z) < P.minkScare ? 'scare' :   // 水貂冲到跟前：嘎！赶走
    !taught.call && ducklings.some(d => d.state === 'floating') ? 'call' : null;    // 第一次有宝宝落水：嘎！叫它回来
  if (want !== TUT.cur) { TUT.cur = want; TUT.t = 0; TUT.quacked = false; TUT.slow = false; if (!want) { glyph.hide(); return; } }
  if (!want) return;
  TUT.t += realDt;
  TUT.pos.set(S.x + 1.5, 1.0, S.z - 0.5);
  if (want === 'tilt') {
    glyph.show('mouse');
    if (mouse.x < -0.45) TUT.left = true; if (mouse.x > 0.45) TUT.right = true;
    if (TUT.left && TUT.right) learn('tilt');
  } else if (want === 'kick') {
    glyph.show(FL.side > 0 ? 'mouseL' : 'mouseR');
    TUT.pos.set(S.x - FL.side * 1.6, 1.0, S.z - 0.2);
  } else if (want === 'cover' || want === 'call' || want === 'scare') {
    glyph.show('shift'); TUT.slow = want === 'cover' && TUT.t < 4;
    if (TUT.quacked) learn(want);
  } else if (want === 'hold') {
    glyph.show('hold'); TUT.slow = TUT.t < 5;
    glyph.progress(S.shiftDown ? Math.min(1, (S.holdT || 0) / P.displayHold) : 0);
  }
  glyph.update(realDt, TUT.pos);
}

// ---------- 主循环（固定步长） ----------
const STEP = 1 / 120;
let acc = 0, last = performance.now();
function frame(now) {
  touchFrame(Math.min(0.05, (performance.now() - (frame.lt || performance.now())) / 1000)); frame.lt = performance.now(); updateTouchUI();
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, (now - last) / 1000); last = now;
  let simDt = 0;
  if (S.started && !S.paused && !S.over) {
    const teetering = P.teeterSlowMo && ducklings.some(d => d.state === 'onBack' && d.teeter > 0);
    if (S.slowMo > 0) { S.slowMo -= realDt; S.timeScale = 0.3; }
    else if (TUT.slow) S.timeScale += (0.3 - S.timeScale) * Math.min(1, realDt * 8);   // 教学时刻：放慢，给时间看清图标
    else S.timeScale += ((teetering ? 0.5 : 1) - S.timeScale) * Math.min(1, realDt * 8);
    simDt = realDt * S.timeScale;
    acc += simDt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    updateWorld(simDt);
    S.quackCd = Math.max(0, S.quackCd - simDt);
    S.flap = Math.max(0, S.flap - simDt);
    S.sink = Math.max(0, S.sink - simDt);
    S.cover = Math.max(0, (S.cover || 0) - simDt);
    // 按住 Shift：报警升级成装受伤（第 3 天起）
    S.displayCd = Math.max(0, (S.displayCd || 0) - simDt);
    if (S.shiftDown && !S.arrived) { S.holdT = (S.holdT || 0) + realDt; if (S.holdT >= P.displayHold && S.displayCd <= 0 && C.day >= 1 && !(S.display > 0)) startDisplay(); }
    if (S.display > 0) updateDisplay(simDt);
    S.dropT = Math.max(0, S.dropT - simDt); S.shake = Math.max(0, S.shake - realDt);
  }
  if (!(S.started && !S.paused && !S.over)) rumbleGain(0);
  ambienceTick(realDt, S.started && !S.paused && !S.over);
  musicTick(realDt, S.started && !S.paused && !S.over);
  syncVisuals(realDt, simDt);
  updateTutorial(realDt);
  book.update(realDt);
  renderer.domElement.style.cursor = S.started && !S.paused && !S.over && !book.visible ? 'none' : 'default';   // 玩的时候藏起鼠标指针：鼠标是用来控制重心的
  stylize.render(POST_MODES[P.post] || 0, now / 1000);
}
